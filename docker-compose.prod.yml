# Production docker-compose using pre-built images from GitHub Container Registry
#
# Run it through the wrapper, which reads the server's own settings from prod.env
# (untracked: APP_VERSION, database password, JWT secret — see prod.env.example):
#   scripts/prod.sh pull
#   scripts/prod.sh up -d
# Operations (upgrade, backup, restore, reboot): docs/operations.md

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped # start again after a host reboot
    environment:
      POSTGRES_USER: openerp
      # Only applied when the volume is created; to change it later see docs/operations.md
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openerp}
      POSTGRES_DB: openerp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost only (admin tools through an SSH tunnel); the backend uses the compose network
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/hansjlachmann/openerp/backend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Users go through nginx (80/443). Published on PUBLISH_HOST (default 127.0.0.1) for a
      # tunnel or proxy on the same host; set PUBLISH_HOST=0.0.0.0 in prod.env only if a
      # proxy on another machine must reach it
      - "${PUBLISH_HOST:-127.0.0.1}:8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: openerp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-openerp}
      DB_NAME: openerp
      COMPANY_NAME: cronus
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-latest}
      # Without it every restart logs all users out (random key per start)
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/hansjlachmann/openerp/frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:3000:3000"
    environment:
      PORT: 3000
      ORIGIN: https://localhost
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
