<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The saved theme from the first paint: the app renders in the browser only (ssr =
		     false), so without this every page load flashed the default colors until the app had
		     started. Default page backgrounds: BC (white / gray-900); a chosen theme's colors come
		     from the cache that src/lib/stores/theme.ts writes. -->
		<style>
			html { background-color: rgb(var(--page-bg, 255 255 255)); }
			html.dark { background-color: rgb(var(--page-bg, 18 18 18)); color-scheme: dark; }
		</style>
		<script>
			// Same keys and default as $lib/stores/theme.ts (dark unless "light" is saved).
			// Only "--name: r g b" pairs are applied: nothing else from storage reaches the page.
			try {
				var mode = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
				if (mode === 'dark') document.documentElement.classList.add('dark');
				var cache = JSON.parse(localStorage.getItem('theme-cache') || 'null');
				var vars = cache && cache[mode];
				if (vars && typeof vars === 'object') {
					for (var name in vars) {
						if (/^--[a-z0-9-]{1,40}$/.test(name) && /^\d{1,3} \d{1,3} \d{1,3}$/.test(vars[name])) {
							document.documentElement.style.setProperty(name, vars[name]);
						}
					}
				}
				// Font and density classes, font size (app.css)
				var classes = (cache && cache.classes) || [];
				for (var i = 0; i < classes.length && i < 4; i++) {
					if (/^(font-[a-z-]{1,20}|density-compact)$/.test(classes[i])) document.documentElement.classList.add(classes[i]);
				}
				var scale = cache && cache.scale;
				if (typeof scale === 'number' && scale >= 0.8 && scale <= 1.5 && scale !== 1) {
					document.documentElement.style.setProperty('--font-scale', String(scale));
				}
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
