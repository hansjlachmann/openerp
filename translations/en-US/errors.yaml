# English (US) error messages
# %1, %2, %3 are placeholders for dynamic values

errors:
  # Record operations
  ERR_DUPLICATE_RECORD: "%1 %2 already exists"
  ERR_RECORD_NOT_FOUND: "%1 %2 not found"
  ERR_VALIDATION_FAILED: "Validation failed for %1: %2"
  ERR_REQUIRED_FIELD: "%1 is required"
  ERR_INVALID_VALUE: "Invalid value '%2' for %1"
  ERR_FIELD_TOO_LONG: "%1 cannot exceed %2 characters"
  ERR_FIELD_TOO_SHORT: "%1 must be at least %2 characters"
  ERR_FIELD_OUT_OF_RANGE: "%1 must be between %2 and %3"
  ERR_FIELD_BELOW_MIN: "%1 must not be less than %2"
  ERR_FIELD_ABOVE_MAX: "%1 must not be greater than %2"
  ERR_FIELD_FORMAT: "%1 must have the format %2"
  ERR_RELATED_NOT_FOUND: "%1 '%2' does not exist"
  ERR_RELATED_INACTIVE: "%1 '%2' is inactive and cannot be used"
  ERR_FIELD_MUST_BE: "%1 must be %2"
  ERR_FIELD_MUST_NOT_BE: "%1 must not be %2"
  ERR_END_TOTAL_NO_BEGIN: "End-Total %1 is missing a matching Begin-Total."
  ERR_FIELD_ERROR: "%1 %2"
  ERR_EMAIL_INVALID: "%1: '%2' is not a valid e-mail address"
  ERR_DATE_FORMULA_INVALID: "%1: '%2' is not a valid date formula (e.g. 30D, 1M, CM, 1M+CM)"
  ERR_THEME_WRONG_MODE: "%1: the theme '%2' is made for the other mode"
  ERR_EMAIL_DUPLICATE: "%1: '%2' is listed more than once"
  ERR_FILTER_INVALID: "%1: '%2' is not a valid filter (e.g. 1000, >1000, 0..500, <>0, 100|200)"
  ERR_DELETE_TOO_MANY: "More than %1 records are selected: delete them in smaller parts (filter the list first)."
  ERR_DELETE_RECORD_FAILED: "%1 %2 cannot be deleted: %3 Nothing was deleted."
  ERR_COPY_TOO_MANY: "More than %1 records: copy and paste them in smaller parts (filter the list first)."
  ERR_SELECTION_TOO_MANY: "More than %1 records are selected: select fewer (filter the list first)."
  ERR_INCONSISTENT: "The transaction cannot be completed because it would leave inconsistencies in: %1. Nothing was saved."
  ERR_FIELD_NOT_EDITABLE: "%1 cannot be changed."
  ERR_MUST_BE_ROUNDED_TO: "%1 must be rounded to the nearest %2."
  ERR_DECIMAL_PLACES_FORMAT: "%1: enter one number or two numbers separated by a colon, from 0 to 9 (e.g. 2:5)."
  ERR_SAME_CURRENCY: "%1 cannot be the same as the currency code."
  ERR_NO_EXCHANGE_RATE: "There is no exchange rate for currency %1 on or before %2."
  ERR_PASTE_RECORD_FAILED: "Record %1 of %2 cannot be pasted: %3 Nothing was pasted."
  ERR_DELETE_FAILED: "Failed to delete %1 %2"
  ERR_INSERT_FAILED: "Failed to insert %1"
  ERR_MODIFY_FAILED: "Failed to modify %1 %2"
  ERR_EMPTY_PRIMARY_KEY: "%1 number cannot be empty"
  ERR_TABLE_NOT_FOUND: "Table '%1' not found"

  # Number series
  ERR_NO_SERIES_MANUAL: "You may not enter numbers manually. If you want to enter numbers manually, please activate %1 in %2 %3."
  ERR_NO_SERIES_DEFAULT: "It is not possible to assign numbers automatically. If you want the program to assign numbers automatically, please activate %1 in %2 %3."
  ERR_NO_SERIES_NO_LINE_ON_DATE: "You cannot assign new numbers from the number series %1 on %2."
  ERR_NO_SERIES_NO_LINE: "You cannot assign new numbers from the number series %1."
  ERR_NO_SERIES_DATE_ORDER: "You cannot assign new numbers from the number series %1 on a date before %2."
  ERR_NO_SERIES_ENDING_NO: "You cannot assign numbers greater than %1 from the number series %2."
  ERR_NO_SERIES_NO_NUMBER: "%1 must contain a number."
  ERR_NO_SERIES_NUMBER_FORMAT: "The number format in %1 must be the same as the number format in %2."
  ERR_NO_SERIES_TOO_LONG: "The number %1 cannot be extended to more than 20 characters."

  # Deleting records with ledger entries
  ERR_DELETE_HAS_ENTRIES: "You cannot delete %1 %2 because it has ledger entries in a fiscal year that has not been closed yet."
  ERR_DELETE_OPEN_ENTRIES: "You cannot delete %1 %2 because there are one or more open ledger entries."
  ERR_CHANGE_OPEN_ENTRIES: "You cannot change %1 because there are one or more open ledger entries for this bank account."
  ERR_FA_MAIN_ASSET_DELETE: "A main asset cannot be deleted."
  ERR_FA_HAS_DEPR_BOOKS: "You cannot delete %1 %2 because it has associated depreciation books."
  ERR_FA_NOT_DISPOSED: "Only disposed fixed assets can be deleted."
  ERR_FA_DELETE_ENTRIES: "You cannot delete a fixed asset that has ledger entries in a fiscal year that has not been closed yet."
  ERR_FA_BUDGET_ENTRIES: "The field %1 cannot be changed for a fixed asset with ledger entries."
  ERR_FA_BUDGET_INSURANCE: "The field %1 cannot be changed for a fixed asset with insurance coverage ledger entries."
  ERR_FA_IS_A: "%2 %3 is a %4."
  ERR_FA_IS_NOT_A: "%2 %3 is not a %4."
  ERR_DEPR_BOOK_IN_USE: "The book cannot be deleted because it is in use."
  ERR_DEPR_BOOK_INSURANCE: "The book cannot be deleted because %2 %1 = %3."
  ERR_RENAME_NOT_ALLOWED: "You cannot rename a %1."
  ERR_DATE_LATER: "%1 is later than %2."

  # Session/Auth
  ERR_NO_ACTIVE_SESSION: "No active session"
  ERR_NOT_LOGGED_IN: "No user logged in"
  ERR_INVALID_CREDENTIALS: "Invalid credentials"
  ERR_USER_INACTIVE: "User account is inactive"
  ERR_USER_NOT_FOUND: "User not found"
  ERR_USER_REQUIRED: "User ID and password are required"
  ERR_USERS_EXIST: "Users already exist. Use the user management interface."
  ERR_CREATE_USER_FAILED: "Failed to create user"

  # Request/Input
  ERR_INVALID_REQUEST_BODY: "Invalid request body"
  ERR_INVALID_FIELDS: "Invalid fields parameter"
  ERR_INVALID_FILTERS: "Invalid filters parameter"
  ERR_INVALID_SORT_FIELD: "Invalid sort field"
  ERR_INVALID_PAGE_ID: "Invalid page ID"
  ERR_LANGUAGE_REQUIRED: "Language is required"
  ERR_UNSUPPORTED_LANGUAGE: "Unsupported language: %1"

  # Company
  ERR_COMPANY_NOT_FOUND: "Company does not exist"
  ERR_COMPANY_VERIFY_FAILED: "Failed to verify company"
  ERR_COMPANY_REQUIRED: "Company name is required"
  ERR_COMPANY_INVALID_NAME: "Company name can only contain letters, numbers, underscores, and hyphens"
  ERR_COMPANY_NAME_LENGTH: "Company name must be between 2 and 50 characters"
  ERR_COMPANY_LIST_FAILED: "Failed to list companies"
  ERR_COMPANY_ALREADY_EXISTS: "Company '%1' already exists"
  ERR_COMPANY_CREATE_FAILED: "Failed to create company"
  ERR_COMPANY_ACCESS_DENIED: "You do not have access to company '%1'"

  # Preferences
  ERR_PREFERENCE_NOT_FOUND: "Preference not found"
  ERR_PREFERENCE_SERIALIZE: "Failed to serialize preference data"
  ERR_PREFERENCE_UPDATE_FAILED: "Failed to update preference"
  ERR_PREFERENCE_SAVE_FAILED: "Failed to save preference"
  ERR_PREFERENCE_DELETE_FAILED: "Failed to delete preference"

  # Permissions
  ERR_PERMISSION_DENIED: "You do not have permission to %1 table '%2'"
  ERR_NO_PERMISSION_CODEUNIT: "You do not have permission to run codeunit %1 %2."
  ERR_NO_PERMISSION_REPORT: "You do not have permission to run report %1 %2."
  ERR_JOB_NO_PERMISSION: "User %1 does not have permission to run codeunit %2."

  # Menu/Pages
  ERR_MENU_NOT_FOUND: "Menu not found"
  ERR_PAGE_NOT_FOUND: "Page %1 not found"
  ERR_JNL_ACCOUNT_TYPES: "%1 or %2 must be G/L Account or Bank Account."
  ERR_JNL_OPTION_NOT_ALLOWED: "%1 cannot be %2."
  ERR_JNL_OPTION_INTERNAL: "The %2 option of %1 can only be used internally in the system."
  ERR_JNL_BANK_ACCOUNT_REQUIRED: "%1 or %2 must be a Bank Account."
  ERR_JNL_WITHOUT_FIELD: "%1 cannot be specified without %2."
  ERR_JNL_RECURRING_ONLY_FIELD: "Only the %1 field can be filled in on recurring journals."
  ERR_JNL_MUST_NOT_BE: "%1 must not be %2."
  ERR_JNL_FIXED_ASSET_NOT_YET: "%1 Fixed Asset cannot be posted yet: it comes with fixed asset posting."
  ERR_JNL_TAX_NOT_YET: "%1 %2 cannot be posted yet: only Sales Tax is supported."
  ERR_JNL_TEMPLATE_TYPE_NO_PAGE: "Journals of %1 %2 cannot be opened yet."
