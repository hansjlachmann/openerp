# The base application (app.json): its identity and the number series its objects and
# fields may use. Every extension app has its own application.yaml with its own series.
# The id never changes. Checked by tablegen, extmerge and at startup (backend/foundation/apps).
application:
  id: 760e20ec-7a66-4e3f-b6e5-83c94db5a4bd
  name: EasyopenERP Base Application
  publisher: Hans J. Lachmann
  contact: https://github.com/hansjlachmann/openerp
  version: 0.1.118 # x-release-please-version
  number_series:
    # Tables, pages, codeunits and reports; a number is unique per object type
    objects:
      - from: 1
        to: 999
      # Classic jobs, resources and inventory cost objects keep their numbers (reports 1002
      # Post Inventory Cost to G/L, 1191–1195 resource prices)
      - from: 1000
        to: 1299
      # Items keep their classic numbers (Item Variant 5401, Item Unit of Measure 5404 …)
      - from: 5400
        to: 5499
      # Fixed assets keep their classic numbers (tables, pages 5600–5661)
      - from: 5600
        to: 5699
      # The document list pages (9300 Sales Quotes …)
      - from: 9300
        to: 9399
    # Fields of the application's tables (field IDs)
    fields:
      - from: 1
        to: 999
      # The classic item fields (Variant Code 5402, Unit of Measure Code 5407 …)
      - from: 5400
        to: 5499
  # System tables (2000000000 range: User, Company, Permission …)
  system_tables:
    - from: 2000000000
      to: 2000000199
  dependencies: []
