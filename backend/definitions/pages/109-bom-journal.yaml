page:
  id: 109
  type: List
  name: BOM Journal
  source_table: BOM_Journal_Line
  caption: BOM Journal
  editable: true
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours
  delayed_insert: true      # inserted when the user leaves the line
  # classic form 109: a line assembles a bill of materials; posting uses its components.
  # Recurring BOM journals come later

  # The batch the journal shows (classic Batch Name above the lines): the page's batch
  # parameter; OnOpenPage (business-logic/pages/bomjournal.go) turns template and batch into
  # the list's filters
  header_fields:
    - param: batch
      source: journal_batch_name
      lookup_page: 265
      lookup_field: name
      lookup_filters:
        journal_template_name: journal_template_name

  # Under the list for the cursor row (OnAfterGetRecord, business-logic/pages/bomjournal.go)
  footer:
    - source: item_description
      calculated: true
      type: types.Text

  layout:
    repeater:
      fields:
        - source: posting_date
          width: 100
        - source: document_date
          width: 100
          visible: false
        - source: document_no
          width: 110
        - source: item_no
          width: 110
        - source: variant_code
          width: 100
          visible: false
        - source: description
          width: 250
        - source: department_code
          width: 110
          visible: false
        - source: project_code
          width: 110
          visible: false
        - source: location_code
          width: 100
        - source: quantity
          width: 100
        - source: unit_of_measure_code
          width: 110
        - source: unit_cost
          width: 120
        - source: total_cost
          width: 120
        - source: reason_code
          width: 110
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true


    # The line's item: its card, ledger entries and bill of materials
    - name: Item
      caption: Item
      image: Card
      promoted: true
      items:
        - name: Card
          caption: Card
          shortcut: Shift+F5
          run_page: 30
          run_page_filter_field: "no"
          run_page_filter_value: item_no
        - name: Ledger Entries
          caption: Ledger Entries
          shortcut: Ctrl+F5
          run_page: 38
          run_page_filter_field: item_no
          run_page_filter_value: item_no
        - name: Bill of Materials
          caption: Bill of Materials
          run_page: 36
          run_page_filter_field: parent_item_no
          run_page_filter_value: item_no

    # Posting: the batch (codeunit 251 BOM Jnl.-Post, after asking; the list's filters say which batch)
    - name: Post
      caption: Post
      image: Post
      shortcut: F11
      promoted: true
      run_object: codeunit:251
