page:
  id: 21
  type: Card
  name: Customer Card
  source_table: Customer
  caption: Customer Card
  list_page_id: 22
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: no
            assist_edit: "table:Customer.AssistEdit"   # pick another number series (…, Shift+F2)
          - source: name
          - source: address
          - source: address_2
          - source: post_code
          - source: city
          - source: state
          - source: contact
          - source: search_name
          - source: territory_code
          - source: balance_lcy
            drilldown: 25   # Customer Ledger Entries of this customer, in a modal
            drilldown_filter_field: customer_no
            drilldown_filter_value: no
            style: Strong
          - source: credit_limit_lcy
          - source: salesperson_code
          - source: blocked
          - source: last_date_modified
          - source: comment
          - source: no_of_ledger_entries
            drilldown: 25   # Customer Ledger Entries of this customer, in a modal
            drilldown_filter_field: customer_no
            drilldown_filter_value: no

      - name: Communication
        caption: Communication
        fields:
          - source: phone_no
          - source: fax_no
          - source: e_mail
          - source: home_page
          - source: telex_no
          - source: telex_answer_back

      - name: Invoicing
        caption: Invoicing
        fields:
          - source: bill_to_customer_no
          - source: invoice_copies
          - source: gen_bus_posting_group
          - source: tax_bus_posting_group
          - source: customer_posting_group
          - source: price_group_code
          - source: invoice_disc_code
          - source: cust_item_disc_gr
          - source: allow_quantity_disc
          - source: prices_including_tax
          - source: tax_liable
          - source: tax_area_code
          - source: department_code
          - source: project_code

      - name: Payments
        caption: Payments
        fields:
          - source: application_method
          - source: payment_terms_code
          - source: payment_method_code
          - source: reminder_terms_code
          - source: fin_charge_terms_code
          - source: print_statements
          - source: last_statement_no

      - name: Shipping
        caption: Shipping
        fields:
          - source: combine_shipments
          - source: location_code
          - source: shipment_method_code
          - source: shipping_agent_code
          - source: reserve

      - name: Foreign Trade
        caption: Foreign Trade
        fields:
          - source: currency_code
          - source: language_code
          - source: country_code
          - source: vat_registration_no
          - source: place_of_export

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      enabled: true
      run_page: 22
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Ledger Entries
      caption: Ledger Entries
      image: Entries
      shortcut: Ctrl+F7
      promoted: true
      run_page: 25
      run_page_filter_field: customer_no
      run_page_filter_value: no

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F7
      promoted: true
      run_page: 151
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Invoice Discounts
      caption: Invoice Discounts
      image: Calculate
      promoted: true
      run_page: 23
      run_page_filter_field: code
      run_page_filter_value: invoice_disc_code

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 124
      run_page_filters:
        - {field: table_name, const: "1"}   # Customer
        - {field: "no", value: "no"}

    - name: Bank Accounts
      caption: Bank Accounts
      image: Card
      promoted: true
      run_page: 424
      run_page_filter_field: customer_no
      run_page_filter_value: "no"

    - name: Ship-to Addresses
      caption: Ship-to Addresses
      image: Navigate
      promoted: true
      run_page: 301
      run_page_filter_field: customer_no
      run_page_filter_value: "no"
