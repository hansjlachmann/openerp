page:
  id: 344
  type: List
  name: Navigate
  source_table: Document_Entry
  caption: Navigate
  editable: false
  source_table_temporary: true   # the lines are found again on every load (OnFindRecords)

  # The document to find: filters on Document No. and Posting Date (blank: any)
  header_fields:
    - param: document_no
      source: document_no
    - param: posting_date
      source: posting_date

  layout:
    repeater:
      fields:
        - source: table_id
          width: 90

        - source: table_name
          width: 300

        - source: no_of_records
          width: 130
          drilldown_page_field: page_id
          drilldown_filters:
            - field: document_no
              value: document_no_filter
              optional: true
            - field: "no"
              value: no_filter
              optional: true
            - field: posting_date
              value: posting_date_filter
              optional: true

  actions:
    - name: Find
      caption: Find
      image: Search
      promoted: true
      apply_header_fields: true   # searches again with the header fields as typed
    - name: Show
      caption: Show
      image: Entries
      promoted: true
      run_page_field: page_id
      run_page_filters:
        - field: document_no
          value: document_no_filter
          optional: true
        - field: "no"
          value: no_filter
          optional: true
        - field: posting_date
          value: posting_date_filter
          optional: true
