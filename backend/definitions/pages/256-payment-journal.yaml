page:
  id: 256
  type: List
  name: Payment Journal
  source_table: Gen_Journal_Line
  caption: Payment Journal
  editable: true
  auto_split_key: true      # a new line gets Line No. 10000, 20000 … or halfway between its neighbours
  delayed_insert: true      # inserted when the user leaves the line
  # classic form 256; check printing comes later

  # The batch the journal shows (classic Batch Name above the lines): the page's batch
  # parameter; OnOpenPage (business-logic/pages/genjournal.go) turns template and batch into
  # the list's filters
  header_fields:
    - param: batch
      source: journal_batch_name
      lookup_page: 251
      lookup_field: name
      lookup_filters:
        journal_template_name: journal_template_name

  # Under the list for the cursor row (OnAfterGetRecord, business-logic/pages/genjournal.go)
  footer:
    - source: account_name
      calculated: true
      type: types.Text
    - source: bal_account_name
      calculated: true
      type: types.Text
    - source: balance
      calculated: true
      type: types.Decimal
      decimal_places: "2:2"
    - source: total_balance
      calculated: true
      type: types.Decimal
      decimal_places: "2:2"

  layout:
    repeater:
      fields:
        - source: posting_date
          width: 100

        - source: document_date
          width: 100
          visible: false

        - source: document_type
          width: 130

        - source: document_no
          width: 110

        - source: account_type
          width: 130

        - source: account_no
          width: 110

        - source: description
          width: 250

        - source: department_code
          width: 110
          visible: false

        - source: project_code
          width: 110
          visible: false

        - source: salespers_purch_code
          width: 110
          visible: false

        - source: currency_code
          width: 110
          visible: false

        - source: gen_posting_type
          width: 130
          visible: false

        - source: gen_bus_posting_group
          width: 110
          visible: false

        - source: gen_prod_posting_group
          width: 110
          visible: false

        - source: tax_bus_posting_group
          width: 110
          visible: false

        - source: tax_prod_posting_group
          width: 110
          visible: false

        - source: amount
          width: 120

        - source: bal_account_type
          width: 130

        - source: bal_account_no
          width: 110

        - source: bal_gen_posting_type
          width: 130
          visible: false

        - source: bal_gen_bus_posting_group
          width: 110
          visible: false

        - source: bal_gen_prod_posting_group
          width: 110
          visible: false

        - source: bal_tax_bus_posting_group
          width: 110
          visible: false

        - source: bal_tax_prod_posting_group
          width: 110
          visible: false

        - source: applies_to_doc_type
          width: 130

        - source: applies_to_doc_no
          width: 110

        - source: applies_to_id
          width: 110
          visible: false

        - source: bank_payment_type
          width: 130

        - source: check_printed
          width: 80
          visible: false

        - source: reason_code
          width: 110
          visible: false

        - source: source_type
          width: 130

        - source: source_no
          width: 110


  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true
