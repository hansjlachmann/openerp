page:
  id: 76
  type: Card
  name: Resource Card
  source_table: Resource
  caption: Resource Card
  list_page_id: 77
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            assist_edit: "table:Resource.AssistEdit"   # pick another number series (…, Shift+F2)
          - source: type
          - source: name
          - source: search_name
          - source: unit_of_measure_code
          - source: resource_group_no
          - source: blocked
          - source: last_date_modified
          - source: comment
      - name: Invoicing
        caption: Invoicing
        fields:
          - source: direct_unit_cost
          - source: indirect_cost_percent
          - source: unit_cost
          - source: price_profit_calculation
          - source: profit_percent
          - source: unit_price
          - source: gen_prod_posting_group
          - source: tax_prod_posting_group
          - source: tax_group_code
          - source: vendor_no
          - source: department_code
          - source: project_code
      - name: Personal Data
        caption: Personal Data
        fields:
          - source: title
          - source: name_2
          - source: address
          - source: address_2
          - source: post_code
          - source: city
          - source: state
          - source: social_security_no
          - source: education
          - source: contract_class
          - source: employment_date
      - name: Picture
        caption: Picture
        fields:
          - source: picture

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 77

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Costs
      caption: Costs
      image: Calculate
      promoted: true
      run_page: 203
      run_page_filters:
        - {field: type, const: "0"}   # Resource
        - {field: code, value: "no"}

    - name: Prices
      caption: Prices
      image: Calculate
      promoted: true
      run_page: 204
      run_page_filters:
        - {field: type, const: "0"}   # Resource
        - {field: code, value: "no"}

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 124
      run_page_filters:
        - {field: table_name, const: "4"}   # Resource
        - {field: "no", value: "no"}

    - name: Picture
      caption: Picture
      image: Attach
      promoted: true
      run_page: 407
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Ledger Entries
      caption: Ledger Entries
      image: Entries
      shortcut: Ctrl+F5
      promoted: true
      run_page: 202
      run_page_filter_field: resource_no
      run_page_filter_value: "no"

    - name: Resource Availability
      caption: Resource Availability
      image: Calendar
      promoted: true
      run_page: 225
      run_page_filter_field: "no"
      run_page_filter_value: "no"
