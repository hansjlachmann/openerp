page:
  id: 160
  type: Card
  name: Sales Statistics
  source_table: Sales_Header   # opened from a sales document (F9) on the document
  caption: Sales Statistics
  editable: false

  # The calculated fields are filled by the page's OnAfterGetRecord trigger
  # (business-logic/pages/salesstatistics.go, Sales-Post SumSalesLines); their captions are
  # pages.sales_statistics.fields.*
  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
          - source: sell_to_customer_name
          - source: line_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: inv_discount_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: tax_amount
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: total_incl_tax
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
            style: Strong
          - source: sales_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: cost_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: profit_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: profit_pct
            calculated: true
            type: types.Decimal
            decimal_places: "1:1"
          - source: quantity
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: parcels
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: net_weight
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: gross_weight
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"
          - source: volume
            calculated: true
            type: types.Decimal
            decimal_places: "0:5"

      - name: Customer
        caption: Customer
        fields:
          - source: bill_to_customer_no
          - source: balance_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: credit_limit_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
          - source: credit_limit_expended_pct
            calculated: true
            type: types.Decimal
            decimal_places: "0:2"
