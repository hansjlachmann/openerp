page:
  id: 30
  type: Card
  name: Item Card
  source_table: Item
  caption: Item Card
  list_page_id: 31
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            assist_edit: "table:Item.AssistEdit"   # pick another number series (…, Shift+F2)
          - source: description
          - source: base_unit_of_measure
          - source: shelf_bin_no
          - source: search_description
          - source: quantity_on_hand
            drilldown: 38
            drilldown_filter_field: item_no
            drilldown_filter_value: "no"
          - source: blocked
          - source: last_date_modified
          - source: comment
      - name: Invoicing
        caption: Invoicing
        fields:
          - source: costing_method
          - source: average_cost
          - source: standard_cost
          - source: unit_cost
          - source: last_direct_cost
          - source: indirect_cost_percent
          - source: price_profit_calculation
          - source: profit_percent
          - source: unit_price
          - source: unit_list_price
          - source: minimum_unit_price
          - source: price_includes_tax
          - source: tax_bus_posting_gr_price
          - source: inventory_posting_group
          - source: net_invoiced_qty
            drilldown: 38
            drilldown_filter_field: item_no
            drilldown_filter_value: "no"
          - source: allow_invoice_disc
          - source: sales_qty_disc_code
          - source: item_cust_disc_gr
          - source: gen_prod_posting_group
          - source: tax_prod_posting_group
          - source: tax_group_code
          - source: sales_unit_of_measure
      - name: Ordering
        caption: Ordering
        fields:
          - source: vendor_no
          - source: vendor_item_no
          - source: lead_time_calculation
          - source: reorder_point
          - source: maximum_inventory
          - source: reorder_quantity
          - source: purch_unit_of_measure
          - source: alternative_item_no
          - source: reserve
          - source: rounding_precision
      - name: Picture
        caption: Picture
        fields:
          - source: picture

      - name: Foreign Trade
        caption: Foreign Trade
        fields:
          - source: gross_weight
          - source: net_weight
          - source: units_per_parcel
          - source: unit_volume
          - source: country_purchased_code
          - source: country_of_origin_code
          - source: duty_code
          - source: duty_due_percent
          - source: duty_unit_conversion

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 31

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true

    - name: Units of Measure
      caption: Units of Measure
      image: Rows
      promoted: true
      run_page: 5404
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Variants
      caption: Variants
      image: Lines
      promoted: true
      run_page: 5401
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Translations
      caption: Translations
      image: Document
      promoted: true
      run_page: 35
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Vendors
      caption: Vendors
      image: Navigate
      promoted: true
      run_page: 114
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 124
      run_page_filters:
        - {field: table_name, const: "3"}   # Item
        - {field: "no", value: "no"}

    - name: Prices
      caption: Prices
      image: Calculate
      promoted: true
      run_page: 33
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Quantity Discounts
      caption: Quantity Discounts
      image: Calculate
      promoted: true
      run_page: 34
      run_page_filter_field: code
      run_page_filter_value: sales_qty_disc_code

    - name: Item/Cust. Discounts
      caption: Item/Cust. Discounts
      image: Calculate
      promoted: true
      run_page: 32
      run_page_filter_field: item_discount_group
      run_page_filter_value: item_cust_disc_gr

    - name: Ledger Entries
      caption: Ledger Entries
      image: Entries
      shortcut: Ctrl+F5
      promoted: true
      run_page: 38
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Application Entries
      caption: Application Entries
      image: Navigate
      promoted: true
      run_page: 506
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Phys. Inventory Ledger Entries
      caption: Phys. Inventory Ledger Entries
      image: Entries
      promoted: true
      run_page: 390
      run_page_filter_field: item_no
      run_page_filter_value: "no"

    - name: Picture
      caption: Picture
      image: Attach
      promoted: true
      run_page: 346
      run_page_filter_field: "no"
      run_page_filter_value: "no"

    - name: Bill of Materials
      caption: Bill of Materials
      image: Rows
      promoted: true
      run_page: 36
      run_page_filter_field: parent_item_no
      run_page_filter_value: "no"

    # The standard cost from the components (codeunit 54; this level or all levels)
    - name: Calc. Standard Cost
      caption: Calc. Standard Cost
      image: Calculate
      promoted: true
      run_object: table:Item.CalcStandardCost

    # The item per period, location or variant (classic Item Availability by), its turnover
    - name: Item Availability by
      caption: Item Availability by
      image: Calendar
      promoted: true
      items:
        - name: Period
          caption: Period
          run_page: 157
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Location
          caption: Location
          run_page: 492
          run_page_filter_field: "no"
          run_page_filter_value: "no"
        - name: Variant
          caption: Variant
          run_page: 5414
          run_page_filter_field: "no"
          run_page_filter_value: "no"

    - name: Turnover
      caption: Turnover
      image: Statistics
      promoted: true
      run_page: 158
      run_page_filter_field: "no"
      run_page_filter_value: "no"
