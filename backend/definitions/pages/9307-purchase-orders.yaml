page:
  id: 9307
  type: List
  name: Purchase Orders
  source_table: Purchase_Header   # OnOpenPage: Document Type = Order (business-logic/pages/purchaseorder.go)
  caption: Purchase Orders
  card_page_id: 50             # a full page: the card has its lines

  layout:
    repeater:
      fields:
        - source: "no"
          width: 120
        - source: buy_from_vendor_no
          width: 130
        - source: buy_from_vendor_name
          width: 250
        - source: order_date
          width: 110
        - source: expected_receipt_date
          width: 130
        - source: purchaser_code
          width: 110
        - source: currency_code
          width: 90
        - source: amount
          width: 130
        - source: amount_including_tax
          width: 150
        - source: vendor_order_no
          width: 150
          visible: false
        - source: location_code
          width: 110
          visible: false

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true


    - name: Post
      caption: Post
      image: Post
      shortcut: F11
      promoted: true
      run_object: codeunit:91

    # what Post would write, nothing saved (Posting Preview 115)
    - name: Preview Posting
      caption: Preview Posting
      image: Search
      shortcut: Ctrl+Alt+F9
      promoted: true
      run_object: "table:Purchase_Header.PreviewPosting"

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F9
      promoted: true
      run_page: 161
      run_page_filters:
        - field: document_type
          value: document_type
        - field: "no"
          value: "no"
