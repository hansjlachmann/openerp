        - source: tax_type
          width: 110

        - source: effective_date
          width: 100

        - source: tax_below_maximum
          width: 120

        - source: maximum_amount_qty
          width: 120

        - source: tax_above_maximum
          width: 120

        - source: calculate_tax_on_tax
          width: 90

  actions:
