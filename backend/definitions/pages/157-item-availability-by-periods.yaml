page:
  id: 157
  type: Card
  name: Item Availability by Periods
  source_table: Item
  caption: Item Availability by Periods
  editable: false
  # classic form 157 with its lines (form 353): the item's inventory per period. The order,
  # scheduled receipt and planned order columns come with the documents and production

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            editable: false
          - source: description
            editable: false
      - name: Periods
        caption: Periods
        period_grid:
          date_filter: date_filter
          drilldown_date_field: posting_date
          view_by: 0
          filters:
            - source: location_filter
              drilldown_filter_field: location_code   # the ledger field a drilldown filters
            - source: variant_filter
              drilldown_filter_field: variant_code
          columns:
            - source: net_change
              drilldown: 38
              drilldown_filter_field: item_no
              drilldown_filter_value: "no"
