page:
  id: 672
  type: List
  name: Job Queue List
  source_table: Job_Queue
  caption: Job Queue
  editable: true
  copy_paste_allowed: true   # Ctrl+C / Ctrl+V copy and paste selected records

  layout:
    repeater:
      fields:
        - source: no
          width: 80

        - source: description
          width: 200

        - source: description_2
          width: 200

        - source: status
          width: 100

        - source: object_id_to_run
          width: 120

        - source: parameter
          width: 200

        - source: next_start
          width: 150

        - source: minutes_between_run
          width: 130

        - source: recurring_job
          width: 100

        - source: recurrence
          width: 110

        - source: notification_email
          width: 250

        - source: notify_on
          width: 110

        - source: notification_language
          width: 110

        - source: user_id
          width: 110

        - source: number_of_entries
          width: 120
          drilldown: 673
          drilldown_filter_field: job_queue_no
          drilldown_filter_value: no

  actions:
    - name: Run
      caption: Run
      image: Run
      shortcut: F9
      promoted: true
      enabled: true
      run_object: field:object_id_to_run

    - name: Send Test E-mail
      caption: Send Test E-mail
      image: Email
      promoted: true
      enabled: true
      run_object: codeunit:455

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    # The job's log: its runs (Job Queue Entries, page 673)
    - name: Log Entries
      caption: Log Entries
      image: Entries
      shortcut: Ctrl+F7
      promoted: true
      enabled: true
      run_page: 673
      run_page_filter_field: job_queue_no
      run_page_filter_value: no

    # Functions with the selected job
    - name: Job Queue
      caption: Job Queue
      image: Card
      promoted: true
      items:
        - name: Show Status
          caption: Show Status
          image: Info
          run_object: table:Job_Queue.ShowStatus
        - name: Add Test Entry
          caption: Add Test Entry
          image: New
          run_object: table:Job_Queue.AddTestEntry
