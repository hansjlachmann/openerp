page:
  id: 673
  type: List
  name: Job Queue Entries List
  source_table: Job_Queue_Entry
  caption: Job Queue Entries
  editable: false

  layout:
    repeater:
      fields:
        - source: entry_no
          width: 80
          primary_key: true

        - source: job_queue_no
          width: 120

        - source: status
          width: 100

        - source: user_id
          width: 100

        - source: description
          width: 250

        - source: error_message
          width: 300

        - source: start_date_time
          width: 150

        - source: end_date_time
          width: 150

  actions:
    # A menu button with menu items; an item can call a function with the current line
    - name: Line
      caption: Line
      image: Lines
      promoted: true
      items:
        - name: Test Line 1
          caption: Test Line 1
          run_object: table:Job_Queue_Entry.ShowLineNo   # business-logic/tables/jobqueueentry.go

        - name: Test Line 2
          caption: Test Line 2

        # A sub-menu: its items call one function with an argument (0, 1, 2)
        - name: Show Line
          caption: Show Line
          image: Info
          items:
            - name: Entry No.
              caption: Entry No.
              run_object: table:Job_Queue_Entry.ShowLine(0)
            - name: Description
              caption: Description
              run_object: table:Job_Queue_Entry.ShowLine(1)
            - name: Status
              caption: Status
              run_object: table:Job_Queue_Entry.ShowLine(2)

    # A plain button next to the menu button
    - name: TEST
      caption: TEST
      promoted: true
      run_object: table:Job_Queue_Entry.Test
