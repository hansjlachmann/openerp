page:
  id: 456
  type: List
  name: No. Series
  source_table: No_Series
  caption: No. Series
  editable: true
  copy_paste_allowed: true   # Ctrl+C / Ctrl+V copy and paste selected records

  layout:
    repeater:
      fields:
        - source: code
          width: 120

        - source: description
          width: 250

        - source: starting_date
          width: 130
          calculated: true          # the current line's (page trigger)
          type: types.Date
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code
          visible: false

        - source: starting_no
          width: 130
          calculated: true          # the current line's (page trigger)
          type: types.Code
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code

        - source: ending_no
          width: 130
          calculated: true          # the current line's (page trigger)
          type: types.Code
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code

        - source: last_date_used
          width: 140
          calculated: true          # the current line's (page trigger)
          type: types.Date
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code

        - source: last_no_used
          width: 140
          calculated: true          # the current line's (page trigger)
          type: types.Code
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code

        - source: warning_no
          width: 130
          calculated: true          # the current line's (page trigger)
          type: types.Code
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code
          visible: false

        - source: increment_by_no
          width: 140
          calculated: true          # the current line's (page trigger)
          type: int
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code
          visible: false

        - source: no_of_lines
          width: 110
          drilldown: 457
          drilldown_filter_field: series_code
          drilldown_filter_value: code

        - source: default_nos
          width: 120

        - source: manual_nos
          width: 120

        - source: date_order
          width: 110

  actions:
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Lines
      caption: Lines
      image: List
      promoted: true
      enabled: true
      run_page: 457
      run_page_filter_field: series_code
      run_page_filter_value: code

    - name: Relationships
      caption: Relationships
      image: List
      promoted: true
      enabled: true
      run_page: 458
      run_page_filter_field: code
      run_page_filter_value: code
