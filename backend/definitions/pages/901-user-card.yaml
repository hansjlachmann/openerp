  enable_navigation: true
  editable: true
  focus_field: "user_id"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: user_id
            editable: true
            caption: User ID
            importance: Promoted

          - source: user_name
            editable: true
            caption: Name
            importance: Promoted

          - source: email
            editable: true
            caption: Email

          - source: language
            editable: true
            caption: Language
            table_relation: Language

          - source: menu
            editable: true
            caption: Menu
            table_relation: Menu

          - source: active
            editable: true
            caption: Active

      - name: Authentication
        caption: Authentication
        fields:
          - source: password      # virtual: the API hashes it into password_hash
            editable: true
            caption: Password
            importance: Promoted
            masked: true

      - name: Timestamps
        caption: Timestamps
        fields:
          - source: created_at
            editable: false
            caption: Created At

          - source: last_login
            editable: false
            caption: Last Login

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      enabled: true
      run_page: 59
    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true
