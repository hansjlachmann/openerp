page:
  id: 152
  type: Card
  name: Vendor Statistics
  source_table: Vendor   # opened from the Vendor Card and List (F7) on one vendor
  caption: Vendor Statistics
  editable: false

  # The calculated fields are filled by the page's OnAfterGetRecord trigger
  # (business-logic/pages/vendorstatistics.go); their captions are pages.vendor_statistics.fields.*
  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
          - source: name
          - source: balance_lcy
            drilldown: 29
            drilldown_filter_field: vendor_no
            drilldown_filter_value: "no"
          - source: total_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"
            style: Strong
          - source: balance_due_to_date_lcy
            calculated: true
            type: types.Decimal
            decimal_places: "2:2"

      - name: This Period
