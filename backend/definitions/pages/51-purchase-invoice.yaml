page:
  id: 51
  type: Card
  name: Purchase Invoice
  source_table: Purchase_Header   # opened from Purchase Invoices (9308) on an invoice; OnNewRecord: Document Type = Invoice
  caption: Purchase Invoice
  list_page_id: 9308
  enable_navigation: true
  editable: true
  focus_field: "no"

  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
            importance: Promoted
            assist_edit: "table:Purchase_Header.AssistEdit"
          - source: buy_from_vendor_no
            importance: Promoted
          - source: order_address_code
          - source: buy_from_vendor_name
          - source: buy_from_address
          - source: buy_from_address_2
          - source: buy_from_post_code
          - source: buy_from_city
          - source: buy_from_state
          - source: buy_from_contact
          - source: your_reference
          - source: posting_date
          - source: document_date
          - source: purchaser_code
          - source: vendor_invoice_no

      # The invoice's lines (Purchase Line), in their line order
      - name: Lines
        caption: Lines
        subpage:
          page_id: 55
          link:
            document_type: document_type
            document_no: "no"

      - name: Invoicing
        caption: Invoicing
        fields:
          - source: pay_to_vendor_no
          - source: pay_to_name
          - source: pay_to_address
          - source: pay_to_address_2
          - source: pay_to_post_code
          - source: pay_to_city
          - source: pay_to_state
          - source: pay_to_contact
          - source: payment_terms_code
          - source: due_date
          - source: payment_discount_percent
          - source: pmt_discount_date
          - source: payment_method_code
          - source: applies_to_doc_type
          - source: applies_to_doc_no
          - source: department_code
          - source: project_code
          - source: vendor_posting_group
          - source: gen_bus_posting_group
          - source: tax_area_code
          - source: tax_liable
          - source: invoice_disc_code

      - name: Shipping
        caption: Shipping
        fields:
          - source: ship_to_name
          - source: ship_to_address
          - source: ship_to_address_2
          - source: ship_to_post_code
          - source: ship_to_city
          - source: ship_to_state
          - source: ship_to_contact
          - source: location_code
          - source: shipment_method_code
          - source: expected_receipt_date

      - name: Foreign Trade
        caption: Foreign Trade
        fields:
          - source: currency_code
          - source: currency_factor
          - source: language_code
          - source: vat_registration_no

  actions:
    - name: Back to List
      caption: Back to List
      image: Back
      shortcut: Esc
      promoted: true
      run_page: 9308

    - name: New
      caption: New
      image: New
      shortcut: Alt+N
      promoted: true

    - name: Edit
      caption: Edit
      image: Edit
      shortcut: Ctrl+E
      promoted: true

    - name: Delete
      caption: Delete
      image: Delete
      shortcut: Ctrl+D
      promoted: true


    - name: Post
      caption: Post
      image: Post
      shortcut: F11
      promoted: true
      run_object: codeunit:91

    # what Post would write, nothing saved (Posting Preview 115)
    - name: Preview Posting
      caption: Preview Posting
      image: Search
      shortcut: Ctrl+Alt+F9
      promoted: true
      run_object: "table:Purchase_Header.PreviewPosting"

    - name: Get Receipt Lines
      caption: Get Receipt Lines
      image: Lines
      promoted: true
      run_object: codeunit:74

    - name: Post and Print
      caption: Post and Print
      image: Print
      shortcut: Shift+F11
      promoted: true
      run_object: codeunit:92

    - name: Statistics
      caption: Statistics
      image: Statistics
      shortcut: F9
      promoted: true
      run_page: 161
      run_page_filters:
        - field: document_type
          value: document_type
        - field: "no"
          value: "no"

    - name: Vendor
      caption: Vendor
      image: Customer
      shortcut: Shift+F5
      promoted: true
      run_page: 26
      run_page_filter_field: "no"
      run_page_filter_value: buy_from_vendor_no

    - name: Comments
      caption: Comments
      image: Document
      promoted: true
      run_page: 66
      run_page_filters:
        - field: document_type
          value: document_type
        - field: "no"
          value: "no"

    - name: Calculate Invoice Discount
      caption: Calculate Invoice Discount
      image: Calculate
      promoted: true
      run_object: codeunit:71
