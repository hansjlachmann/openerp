page:
  id: 151
  type: Card
  name: Customer Statistics
  source_table: Customer   # opened from the Customer Card and List (F7) on one customer
  caption: Customer Statistics
  editable: false

  # The calculated fields are filled by the page's OnAfterGetRecord trigger
  # (business-logic/pages/customerstatistics.go); their captions are pages.customer_statistics.fields.*
  layout:
    sections:
      - name: General
        caption: General
        fields:
          - source: "no"
          - source: name
          - source: balance_lcy
            drilldown: 25
            drilldown_filter_field: customer_no
            drilldown_filter_value: "no"
          - source: total_lcy
            calculated: true
            type: types.Decimal
            style: Strong
          - source: credit_limit_lcy
          - source: balance_due_to_date_lcy
            calculated: true
            type: types.Decimal

      - name: This Period
