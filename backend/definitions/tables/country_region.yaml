table:
  id: 9
  name: "Country_Region"
  caption: Country/Region
  description: Countries and regions (table 9 Country/Region)
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      primary_key: true
      length: 10
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      length: 50

    - name: eu_country_code
      no: 6
      type: types.Code
      db_name: eu_country_code
      length: 10

    - name: intrastat_code
      no: 7
      type: types.Code
      db_name: intrastat_code
      length: 10

    - name: address_format
      no: 8
      type: Option
      db_name: address_format
      options: ["Post Code+City", "City+Post Code", "City+State+Post Code", "Blank Line+Post Code+City"]
      default: 1 # City+Post Code

    - name: contact_address_format
      no: 9
      type: Option
      db_name: contact_address_format
      options: ["First", "After Company Name", "Last"]
      default: 1 # After Company Name

  keys:
    - name: Primary
      fields: [code]
      clustered: true
    - name: eu_country_code
      fields: [eu_country_code]
    - name: intrastat_code
      fields: [intrastat_code]
