table:
  id: 81
  name: "Gen_Journal_Line"
  caption: Gen. Journal Line
  description: "General journal lines (table 81): the lines of a journal batch, posted by the posting codeunits"
  fields:
    - name: journal_template_name
      no: 1
      type: types.Code
      db_name: journal_template_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: Gen_Journal_Template
        field: name
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: journal_batch_name
      no: 51
      type: types.Code
      db_name: journal_batch_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: Gen_Journal_Batch
        field: name
        filters:
          journal_template_name: {field: journal_template_name}
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: line_no
      no: 2
      type: int
      db_name: line_no
      primary_key: true
      required: true

    - name: account_type
      no: 3
      type: Option
      db_name: account_type
      options: ["G/L Account", "Customer", "Vendor", "Bank Account", "Fixed Asset"]

    - name: account_no
      no: 4
      type: types.Code
      db_name: account_no
      length: 20
      table_relation:
        conditions:
          - when: {field: account_type, equal: 0}
            table: G_L_Account
            field: no
            filters:
              account_type: {const: 0}   # Posting accounts only
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: account_type, equal: 1}
            table: Customer
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: account_type, equal: 2}
            table: Vendor
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: account_type, equal: 3}
            table: Bank_Account
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: account_type, equal: 4}
            table: Fixed_Asset
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: description
                width: 250

    - name: posting_date
      no: 5
      type: types.Date
      db_name: posting_date

    - name: document_type
      no: 6
      type: Option
      db_name: document_type
      options: [" ", "Payment", "Invoice", "Credit Memo", "Finance Charge Memo", "Reminder"]

    - name: document_no
      no: 7
      type: types.Code
      db_name: document_no
      length: 20

    - name: description
      no: 8
      type: types.Text
      db_name: description
      length: 50

    - name: tax_percent
      no: 10
      type: types.Decimal
      db_name: tax_percent
      editable: false
      decimal_places: "0:5"
      validation: {min: 0, max: 100}
      precision: 18
      scale: 5

    - name: bal_account_no
      no: 11
      type: types.Code
      db_name: bal_account_no
      length: 20
      table_relation:
        conditions:
          - when: {field: bal_account_type, equal: 0}
            table: G_L_Account
            field: no
            filters:
              account_type: {const: 0}   # Posting accounts only
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: bal_account_type, equal: 1}
            table: Customer
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: bal_account_type, equal: 2}
            table: Vendor
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: bal_account_type, equal: 3}
            table: Bank_Account
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: bal_account_type, equal: 4}
            table: Fixed_Asset
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: description
                width: 250

    - name: currency_code
      no: 12
