table:
  id: 99
  name: "Item_Vendor"
  description: "The vendors of an item: their item no., cost and lead time (table 99)"
  fields:
    - name: item_no
      no: 1
      type: types.Code
      db_name: item_no
      length: 20
      primary_key: true
      required: true
      table_relation:
        table: Item
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: vendor_no
      no: 2
      type: types.Code
      db_name: vendor_no
      length: 20
      primary_key: true
      required: true
      table_relation:
        table: Vendor
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: unit_of_measure_code
      no: 5400
      type: types.Code
      db_name: unit_of_measure_code
      length: 10
      primary_key: true
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: item_no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

    - name: starting_date
      no: 4
      type: types.Date
      db_name: starting_date
      primary_key: true

    - name: currency_code
      no: 3
      type: types.Code
      db_name: currency_code
      length: 10
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: direct_unit_cost
      no: 5
      type: types.Decimal
      db_name: direct_unit_cost
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: lead_time_calculation
      no: 6
      type: types.Code
      db_name: lead_time_calculation
      length: 20
      date_formula: true

    - name: vendor_item_no
      no: 7
      type: types.Text
      db_name: vendor_item_no
      length: 20

  keys:
    - name: Primary
      fields: [item_no, vendor_no, unit_of_measure_code, starting_date]
      clustered: true
    - name: vendor
      fields: [vendor_no]
