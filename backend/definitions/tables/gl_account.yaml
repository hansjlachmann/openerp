table:
  id: 15
  name: "G_L_Account"
  caption: G/L Account
  description: General ledger accounts, the chart of accounts (table 15)
  data_caption_fields: [no, name]
  lookup_page_id: 18   # G/L Account List (classic LookupFormID)
  # Not yet (TODO): 12 Comment, the budget FlowFields/Filter, Business Unit Filter, 46 Picture, 10000
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      length: 30

    - name: search_name
      no: 3
      type: types.Code
      db_name: search_name
      length: 30

    - name: account_type
      no: 4
      type: Option
      db_name: account_type
      options: ["Posting", "Heading", "Total", "Begin-Total", "End-Total"]

    - name: department_code
      no: 6
      type: types.Code
      db_name: department_code
      length: 10
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_code
      no: 7
      type: types.Code
      db_name: project_code
      length: 10
      table_relation:
        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: income_balance
      no: 9
      type: Option
      db_name: income_balance
      options: ["Income Statement", "Balance Sheet"]

    - name: debit_credit
      no: 10
      type: Option
      db_name: debit_credit
      options: ["Both", "Debit", "Credit"]

    - name: no_2
      no: 11
      type: types.Code
      db_name: no_2
      length: 20

    - name: blocked
      no: 13
      type: bool
      db_name: blocked

    - name: direct_posting
      no: 14
      type: bool
      db_name: direct_posting
      default: true

    - name: reconciliation_account
      no: 16
      type: bool
      db_name: reconciliation_account

    - name: new_page
      no: 17
      type: bool
      db_name: new_page

    - name: no_of_blank_lines
      no: 18
      type: int
      db_name: no_of_blank_lines
      validation: {min: 0}

    - name: indentation
      no: 19
      type: int
      db_name: indentation
      validation: {min: 0}

    - name: last_date_modified
      no: 26
      type: types.Date
      db_name: last_date_modified
      editable: false

    - name: totaling
      no: 34
      type: types.Text
      db_name: totaling
      length: 30
      table_relation:
        table: G_L_Account
        field: no
        validate: false   # a filter of accounts (1000..1999|3000): the lookup only
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    # FlowFilters (not stored) for the totals below
    - name: date_filter
      no: 28
      type: types.Date
      flow_filter: true

    - name: department_filter
      no: 29
      type: types.Code
      length: 10
      flow_filter: true

    - name: project_filter
      no: 30
      type: types.Code
      length: 10
      flow_filter: true

    # FlowFields: totals of the G/L entries (a total account: of the accounts in its Totaling)
    - name: balance_at_date
      no: 31
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"   # an amount (classic AutoFormatType=1)
      calc_formula: Sum
      source_table: GLEntry
      source_field: amount
      flow_filters:
        - field: gl_account_no
          type: field
          value: no
        - field: gl_account_no
          type: field_filter   # a total account sums the accounts of its Totaling
          value: totaling
        - field: department_code
          type: filter
          value: department_filter
        - field: project_code
          type: filter
          value: project_filter
        - field: posting_date
          type: filter
          value: date_filter
          upper_limit: true

    - name: net_change
      no: 32
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"   # an amount (classic AutoFormatType=1)
      calc_formula: Sum
      source_table: GLEntry
      source_field: amount
      flow_filters:
        - field: gl_account_no
          type: field
          value: no
        - field: gl_account_no
          type: field_filter   # a total account sums the accounts of its Totaling
          value: totaling
        - field: department_code
          type: filter
          value: department_filter
        - field: project_code
          type: filter
          value: project_filter
        - field: posting_date
          type: filter
          value: date_filter

    - name: balance
      no: 36
      type: types.Decimal
      flow_field: true
      decimal_places: "2:2"   # an amount (classic AutoFormatType=1)
      calc_formula: Sum
      source_table: GLEntry
      source_field: amount
      flow_filters:
        - field: gl_account_no
          type: field
          value: no
        - field: gl_account_no
          type: field_filter   # a total account sums the accounts of its Totaling
          value: totaling
        - field: department_code
          type: filter
          value: department_filter
        - field: project_code
          type: filter
          value: project_filter

    - name: debit_amount
      no: 47
