      flow_field: true
      decimal_places: "2:2"   # an amount (classic AutoFormatType=1)
      calc_formula: Sum
      source_table: GLEntry
      source_field: debit_amount
      flow_filters:
        - field: gl_account_no
          type: field
          value: no
        - field: gl_account_no
          type: field_filter   # a total account sums the accounts of its Totaling
          value: totaling
        - field: department_code
          type: filter
          value: department_filter
        - field: project_code
          type: filter
          value: project_filter
        - field: posting_date
          type: filter
          value: date_filter

    - name: credit_amount
      no: 48
