      fields: [no]
      clustered: true
    - name: search_name
      fields: [search_name]
    - name: reconciliation_account
      fields: [reconciliation_account]
    - name: gen_bus_posting_group
      fields: [gen_bus_posting_group]
    - name: gen_prod_posting_group
