table:
  id: 2000000002
  name: User
  caption: User
  description: System users with authentication
  global: true  # Global table - no company prefix
  fields:
    - name: user_id
      no: 1
      type: types.Code
      db_name: user_id
      caption: User ID
      description: Unique user identifier
      primary_key: true
      length: 50
      required: true

    - name: user_name
      no: 2
      type: types.Text
      db_name: user_name
      caption: User Name
      description: Full name of the user
      length: 100

    - name: email
      no: 3
      type: types.Text
      db_name: email
      caption: Email
      description: User email address
      length: 100

    - name: password_hash
      no: 4
      type: types.Text
      db_name: password_hash
      caption: Password Hash
      description: Hashed password (bcrypt)
      sensitive: true  # never sent by the API; set through the virtual "password" field

    - name: language
      no: 5
      type: types.Code
      db_name: language
      caption: Language
      description: Preferred language (en-US, nb-NO, etc.)
      length: 10
      table_relation:
        table: Language
        field: code
        lookup_columns:
          - source: code
            width: 80
          - source: name
            width: 200

    - name: menu
      no: 6
      type: types.Code
      db_name: menu
      caption: Menu
      description: Assigned menu profile
      length: 20
      table_relation:
        table: Menu
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 200

    - name: active
      no: 7
      type: bool
      db_name: active
      caption: Active
      description: Whether user account is active
      default: true

    - name: created_at
      no: 8
      type: types.DateTime
      db_name: created_at
      caption: Created At
      description: When this user was created

    - name: last_login
      no: 9
      type: types.DateTime
      db_name: last_login
      caption: Last Login
      description: When user last logged in
     

  keys:
    - name: Primary
      fields: [user_id]
      clustered: true
