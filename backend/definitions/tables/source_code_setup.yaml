table:
  id: 242
  name: "Source_Code_Setup"
  caption: Source Code Setup
  description: "Source code setup (table 242): the source code of each journal and posting routine, a single record per company"
  setup_table: true    # singleton: a single record with a blank Primary Key
  fields:
