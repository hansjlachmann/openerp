      no: 1
      type: types.Code
      db_name: primary_key
      length: 10
      primary_key: true

    - name: sales
      no: 2
      type: types.Code
      db_name: sales
      length: 10
      table_relation:
        table: Source_Code
        field: code
        lookup_columns:
