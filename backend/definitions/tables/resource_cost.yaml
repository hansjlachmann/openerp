table:
  id: 202
  name: "Resource_Cost"
  description: "Resource Costs (table 202)"
  lookup_page_id: 203
  fields:
    - name: type
      no: 1
      type: Option
      db_name: type
      primary_key: true
      options: ["Resource", "Group(Resource)", "All"]

    - name: code
      no: 2
      type: types.Code
      db_name: code
      length: 20
      primary_key: true
      table_relation:
        conditions:
          - when: {field: type, equal: 0}
            table: Resource
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: type, equal: 1}
            table: Resource_Group
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250

    - name: work_type_code
      no: 3
      type: types.Code
      db_name: work_type_code
      length: 10
      primary_key: true
      table_relation:
        table: Work_Type
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    # classic "USD Extra": an amount in local currency added to the cost
    - name: cost_type
      no: 4
      type: Option
      db_name: cost_type
      options: ["Fixed", "% Extra", "LCY Extra"]

    - name: direct_unit_cost
      no: 5
      type: types.Decimal
      db_name: direct_unit_cost
      decimal_places: "2:5"
      precision: 18
      scale: 5

    - name: unit_cost
      no: 6
      type: types.Decimal
      db_name: unit_cost
      decimal_places: "2:5"
      precision: 18
      scale: 5

  keys:
    - name: Primary
      fields: [type, code, work_type_code]
      clustered: true
