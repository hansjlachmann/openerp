table:
  id: 27
  name: "Item"
  description: "Items (table 27)"
  data_caption_fields: [no, description]
  auto_key: true   # OnInsert gives an item without No. the next number of its series
  lookup_page_id: 31
  # Left out until their tables exist: 47 Tariff No., 84/85 Qty. on
  # Purch./Sales Order, 96 Automatic Ext. Text, 101-103/5429/5430 reserved quantities, 104
  # Add.-Curr. Average Cost, manufacturing and requisition fields 5400-5421/5428, 5423 Bin Filter,
  # 10004 Duty Class (local series).
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: no_2
      no: 2
      type: types.Code
      db_name: no_2
      length: 20

    - name: description
      no: 3
      type: types.Text
      db_name: description
      length: 50

    - name: search_description
      no: 4
      type: types.Code
      db_name: search_description
      length: 50

    - name: description_2
      no: 5
      type: types.Text
      db_name: description_2
      length: 50

    - name: bill_of_materials
      no: 6
      type: bool
      db_name: bill_of_materials
      flow_field: true
      calc_formula: Exist
      source_table: BOMComponent
      source_field: line_no
      flow_filters:
        - field: parent_item_no
          type: field
          value: no

    - name: class
      no: 7
      type: types.Code
      db_name: class
      length: 10

    - name: base_unit_of_measure
      no: 8
      type: types.Code
      db_name: base_unit_of_measure
      length: 10
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

    - name: price_unit_conversion
      no: 9
      type: int
      db_name: price_unit_conversion

    - name: inventory_posting_group
      no: 11
      type: types.Code
      db_name: inventory_posting_group
      length: 10
      table_relation:
        table: Inventory_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: shelf_bin_no
      no: 12
      type: types.Code
      db_name: shelf_bin_no
      length: 10

    - name: sales_qty_disc_code
      no: 13
      type: types.Code
      db_name: sales_qty_disc_code
      length: 20
      table_relation:
        table: Item
        field: no
        validate: false
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: item_cust_disc_gr
      no: 14
      type: types.Code
      db_name: item_cust_disc_gr
      length: 10
      table_relation:
        table: Item_Discount_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: allow_invoice_disc
      no: 15
      type: bool
      db_name: allow_invoice_disc
      default: true

    - name: statistics_group
      no: 16
      type: int
      db_name: statistics_group

    - name: commission_group
      no: 17
      type: int
      db_name: commission_group

    - name: unit_price
      no: 18
      type: types.Decimal
      db_name: unit_price
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: price_profit_calculation
      no: 19
      type: Option
      db_name: price_profit_calculation
      options: ["Profit=Price-Cost", "Price=Cost+Profit", "No Relationship"]

    # Classic MaxValue 99.99999 limits only what the user types; the price/profit calculation
    # gives 100 for a price without cost, so it is not a stored-value check here
    - name: profit_percent
      no: 20
      type: types.Decimal
      db_name: profit_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: costing_method
      no: 21
      type: Option
      db_name: costing_method
      options: ["FIFO", "LIFO", "Specific", "Average", "Standard"]

    - name: unit_cost
      no: 22
      type: types.Decimal
      db_name: unit_cost
      editable: false
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: standard_cost
