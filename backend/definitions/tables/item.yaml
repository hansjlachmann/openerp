table:
  id: 27
  name: "Item"
  description: "Items (table 27)"
  data_caption_fields: [no, description]
  auto_key: true   # OnInsert gives an item without No. the next number of its series
  lookup_page_id: 31
  # Left out until their tables exist: 6 Bill of Materials (BOM), 47 Tariff No., 84/85 Qty. on
  # Purch./Sales Order, 96 Automatic Ext. Text, 101-103/5429/5430 reserved quantities, 104
  # Add.-Curr. Average Cost, manufacturing and requisition fields 5400-5421/5428, 5423 Bin Filter,
  # 10004 Duty Class (local series). Prices/discounts (13, 14), ledger FlowFields (68-83, 93, 94,
  # 89 Drop Shipment Filter) and 92 Picture come with the next parts of the step.
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: no_2
      no: 2
      type: types.Code
      db_name: no_2
      length: 20

    - name: description
      no: 3
      type: types.Text
      db_name: description
      length: 50

    - name: search_description
      no: 4
      type: types.Code
      db_name: search_description
      length: 50

    - name: description_2
      no: 5
      type: types.Text
      db_name: description_2
      length: 50

    - name: class
      no: 7
      type: types.Code
      db_name: class
      length: 10

    - name: base_unit_of_measure
      no: 8
      type: types.Code
      db_name: base_unit_of_measure
      length: 10
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

    - name: price_unit_conversion
      no: 9
      type: int
      db_name: price_unit_conversion

    - name: inventory_posting_group
      no: 11
      type: types.Code
      db_name: inventory_posting_group
      length: 10
      table_relation:
        table: Inventory_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: shelf_bin_no
      no: 12
      type: types.Code
      db_name: shelf_bin_no
      length: 10

    - name: allow_invoice_disc
      no: 15
      type: bool
      db_name: allow_invoice_disc
      default: true

    - name: statistics_group
      no: 16
      type: int
      db_name: statistics_group

    - name: commission_group
      no: 17
      type: int
      db_name: commission_group

    - name: unit_price
      no: 18
      type: types.Decimal
      db_name: unit_price
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: price_profit_calculation
      no: 19
      type: Option
      db_name: price_profit_calculation
      options: ["Profit=Price-Cost", "Price=Cost+Profit", "No Relationship"]

    - name: profit_percent
      no: 20
      type: types.Decimal
      db_name: profit_percent
      decimal_places: "0:5"
      validation: {max: 99.99999}
      precision: 18
      scale: 5

    - name: costing_method
      no: 21
      type: Option
      db_name: costing_method
      options: ["FIFO", "LIFO", "Specific", "Average", "Standard"]

    - name: unit_cost
      no: 22
      type: types.Decimal
      db_name: unit_cost
      editable: false
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: standard_cost
      no: 24
      type: types.Decimal
      db_name: standard_cost
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: last_direct_cost
      no: 25
      type: types.Decimal
      db_name: last_direct_cost
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: average_cost
      no: 26
      type: types.Decimal
      db_name: average_cost
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: minimum_unit_price
      no: 27
      type: types.Decimal
      db_name: minimum_unit_price
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: indirect_cost_percent
      no: 28
      type: types.Decimal
      db_name: indirect_cost_percent
      decimal_places: "0:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: vendor_no
      no: 31
      type: types.Code
      db_name: vendor_no
      length: 20
      table_relation:
        table: Vendor
        field: no
        validate: false
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: vendor_item_no
      no: 32
      type: types.Text
      db_name: vendor_item_no
      length: 20

    - name: lead_time_calculation
      no: 33
      type: types.Code
      db_name: lead_time_calculation
      length: 20
      date_formula: true

    - name: reorder_point
      no: 34
      type: types.Decimal
      db_name: reorder_point
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: maximum_inventory
      no: 35
      type: types.Decimal
      db_name: maximum_inventory
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: reorder_quantity
      no: 36
      type: types.Decimal
      db_name: reorder_quantity
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: alternative_item_no
      no: 37
      type: types.Code
      db_name: alternative_item_no
      length: 20
      table_relation:
        table: Item
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: unit_list_price
      no: 38
      type: types.Decimal
      db_name: unit_list_price
      decimal_places: "2:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: duty_due_percent
      no: 39
      type: types.Decimal
      db_name: duty_due_percent
      decimal_places: "0:5"
      validation: {min: 0, max: 100}
      precision: 18
      scale: 5

    - name: duty_code
      no: 40
      type: types.Code
      db_name: duty_code
      length: 10

    - name: gross_weight
      no: 41
      type: types.Decimal
      db_name: gross_weight
      decimal_places: "0:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: net_weight
      no: 42
      type: types.Decimal
      db_name: net_weight
      decimal_places: "0:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: units_per_parcel
      no: 43
      type: types.Decimal
      db_name: units_per_parcel
      decimal_places: "0:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: unit_volume
      no: 44
      type: types.Decimal
      db_name: unit_volume
      decimal_places: "0:5"
      validation: {min: 0}
      precision: 18
      scale: 5

    - name: durability
      no: 45
      type: types.Code
      db_name: durability
      length: 10

    - name: freight_type
      no: 46
      type: types.Code
      db_name: freight_type
      length: 10

    - name: duty_unit_conversion
      no: 48
      type: types.Decimal
      db_name: duty_unit_conversion
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: country_purchased_code
      no: 49
      type: types.Code
      db_name: country_purchased_code
      length: 10
      table_relation:
        table: Country_Region
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: budget_quantity
      no: 50
      type: types.Decimal
      db_name: budget_quantity
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: budgeted_amount
      no: 51
      type: types.Decimal
      db_name: budgeted_amount
      decimal_places: "2:2"
      precision: 18
      scale: 2

    - name: budget_profit
      no: 52
      type: types.Decimal
      db_name: budget_profit
      decimal_places: "2:2"
      precision: 18
      scale: 2

    - name: comment
      no: 53
      type: bool
      db_name: comment
      flow_field: true
      calc_formula: Exist
      source_table: CommentLine
      source_field: line_no
      flow_filters:
        - field: table_name
          type: const
          value: 3   # Item
        - field: no
          type: field
          value: no

    - name: blocked
      no: 54
      type: bool
      db_name: blocked

    - name: last_date_modified
      no: 62
      type: types.Date
      db_name: last_date_modified
      editable: false

    - name: date_filter
      no: 64
      type: types.Date
      db_name: date_filter
      flow_filter: true

    - name: department_filter
      no: 65
      type: types.Code
      db_name: department_filter
      flow_filter: true
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_filter
      no: 66
      type: types.Code
      db_name: project_filter
      flow_filter: true
      table_relation:
        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: location_filter
      no: 67
      type: types.Code
      db_name: location_filter
      flow_filter: true
      table_relation:
        table: Location
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: price_includes_tax
      no: 87
      type: bool
      db_name: price_includes_tax

    - name: tax_bus_posting_gr_price
      no: 90
      type: types.Code
      db_name: tax_bus_posting_gr_price
      length: 10
      table_relation:
        table: Tax_Business_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: gen_prod_posting_group
      no: 91
      type: types.Code
      db_name: gen_prod_posting_group
      length: 10
      table_relation:
        table: Gen_Product_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: country_of_origin_code
      no: 95
      type: types.Code
      db_name: country_of_origin_code
      length: 10
      table_relation:
        table: Country_Region
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: no_series
      no: 97
      type: types.Code
      db_name: no_series
      length: 10
      editable: false
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_group_code
      no: 98
      type: types.Code
      db_name: tax_group_code
      length: 10
      table_relation:
        table: Tax_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_prod_posting_group
      no: 99
      type: types.Code
      db_name: tax_prod_posting_group
      length: 10
      table_relation:
        table: Tax_Product_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: reserve
      no: 100
      type: Option
      db_name: reserve
      options: ["Never", "Optional", "Always"]
      default: 1

    - name: inventory_value_zero
      no: 5409
      type: bool
      db_name: inventory_value_zero

    - name: rounding_precision
      no: 5422
      type: types.Decimal
      db_name: rounding_precision
      default: 1
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: variant_filter
      no: 5424
      type: types.Code
      db_name: variant_filter
      flow_filter: true
      table_relation:
        table: Item_Variant
        field: code
        filters:
          item_no: {field: no}
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: sales_unit_of_measure
      no: 5425
      type: types.Code
      db_name: sales_unit_of_measure
      length: 10
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

    - name: purch_unit_of_measure
      no: 5426
      type: types.Code
      db_name: purch_unit_of_measure
      length: 10
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

  keys:
    - name: Primary
      fields: [no]
      clustered: true
    - name: search_description
      fields: [search_description]
    - name: inventory_posting_group
      fields: [inventory_posting_group]
    - name: shelf_bin_no
      fields: [shelf_bin_no]
    - name: vendor_no
      fields: [vendor_no]
    - name: gen_prod_posting_group
      fields: [gen_prod_posting_group]
