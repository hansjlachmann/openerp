table:
  id: 2000000005
  name: "Permission"
  caption: Permission
  description: Permissions per role — table data (read, insert, modify, delete) and running reports and codeunits (execute)
  global: true  # Global table - no company prefix
  fields:
    - name: role_id
      no: 1
      type: types.Code
      db_name: role_id
      caption: Role ID
      primary_key: true
      length: 20
      required: true
      table_relation:
        table: User_Role
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 200

    - name: table_name
      no: 2
      type: types.Code
      db_name: table_name
      caption: Object Name   # a table's name; for a report or codeunit "REPORT 93" / "CODEUNIT 6" (filled from Object Type and ID)
      primary_key: true
      length: 100
      required: true

    - name: can_read
      no: 3
      type: bool
      db_name: can_read
      caption: Read

    - name: can_insert
      no: 4
      type: bool
      db_name: can_insert
      caption: Insert

    - name: can_modify
      no: 5
      type: bool
      db_name: can_modify
      caption: Modify

    - name: can_delete
      no: 6
      type: bool
      db_name: can_delete
      caption: Delete

    - name: object_type
      no: 7
      type: Option
      db_name: object_type
      caption: Object Type
      options: ["Table Data", "Report", "Codeunit"]

    - name: object_id
      no: 8
      type: int
      db_name: object_id
      caption: Object ID

    - name: can_execute
      no: 9
      type: bool
      db_name: can_execute
      caption: Execute

  keys:
    - name: Primary
      fields: [role_id, table_name]
      clustered: true
