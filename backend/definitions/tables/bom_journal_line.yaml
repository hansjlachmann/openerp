table:
  id: 89
  name: "BOM_Journal_Line"
  description: "BOM journal lines (table 89): the assembly of bills of materials"
  # Left out until their objects exist: 17-19 recurring (recurring journals); 23, 24, 5423
  # reserved quantities and Reserve (reservations); 5400 Lot No., 5403 Bin Code (item tracking, bins)
  fields:
    - name: journal_template_name
      no: 1
      type: types.Code
      db_name: journal_template_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: BOM_Journal_Template
        field: name
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: journal_batch_name
      no: 15
      type: types.Code
      db_name: journal_batch_name
      length: 10
      primary_key: true
      required: true
      table_relation:
        table: BOM_Journal_Batch
        field: name
        filters:
          journal_template_name: {field: journal_template_name}
        lookup_columns:
          - source: name
            width: 100
          - source: description
            width: 250

    - name: line_no
      no: 2
      type: int
      db_name: line_no
      primary_key: true

    - name: item_no
      no: 3
      type: types.Code
      db_name: item_no
      length: 20
      table_relation:
        table: Item
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: description
            width: 250

    - name: posting_date
      no: 4
      type: types.Date
      db_name: posting_date

    - name: document_no
      no: 5
      type: types.Code
      db_name: document_no
      length: 20

    - name: description
      no: 6
      type: types.Text
      db_name: description
      length: 50

    - name: department_code
      no: 7
      type: types.Code
      db_name: department_code
      length: 10
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_code
      no: 8
      type: types.Code
      db_name: project_code
      length: 10
      table_relation:
        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: location_code
      no: 9
      type: types.Code
      db_name: location_code
      length: 10
      table_relation:
        table: Location
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: quantity
      no: 10
      type: types.Decimal
      db_name: quantity
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: unit_cost
      no: 11
      type: types.Decimal
      db_name: unit_cost
      decimal_places: "2:5"
      precision: 18
      scale: 5
      editable: false

    - name: total_cost
      no: 12
      type: types.Decimal
      db_name: total_cost
      decimal_places: "2:2"
      precision: 18
      scale: 5
      editable: false

    - name: inventory_posting_group
      no: 13
      type: types.Code
      db_name: inventory_posting_group
      length: 10
      editable: false
      table_relation:
        table: Inventory_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: source_code
      no: 14
      type: types.Code
      db_name: source_code
      length: 10
      editable: false
      table_relation:
        table: Source_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: reason_code
      no: 16
      type: types.Code
      db_name: reason_code
      length: 10
      table_relation:
        table: Reason_Code
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: document_date
      no: 20
      type: types.Date
      db_name: document_date

    - name: external_document_no
      no: 21
      type: types.Code
      db_name: external_document_no
      length: 20

    - name: posting_no_series
      no: 22
      type: types.Code
      db_name: posting_no_series
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: variant_code
      no: 5402
      type: types.Code
      db_name: variant_code
      length: 10
      table_relation:
        table: Item_Variant
        field: code
        filters:
          item_no: {field: item_no}
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: qty_per_unit_of_measure
      no: 5404
      type: types.Decimal
      db_name: qty_per_unit_of_measure
      decimal_places: "0:5"
      precision: 18
      scale: 5
      default: 1
      editable: false

    - name: unit_of_measure_code
      no: 5407
      type: types.Code
      db_name: unit_of_measure_code
      length: 10
      table_relation:
        table: Item_Unit_of_Measure
        field: code
        filters:
          item_no: {field: item_no}
        lookup_columns:
          - source: code
            width: 100
          - source: qty_per_unit_of_measure
            width: 120

    - name: quantity_base
      no: 5410
      type: types.Decimal
      db_name: quantity_base
      decimal_places: "0:5"
      precision: 18
      scale: 5

  keys:
    - name: Primary
      fields: [journal_template_name, journal_batch_name, line_no]
      clustered: true
