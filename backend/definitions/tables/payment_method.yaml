table:
  id: 289
  name: "Payment_Method"
  caption: Payment Method
  description: "Payment methods of customers and vendors (table 289)"
  data_caption_fields: [code, description]
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      length: 10
      primary_key: true
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      length: 30

    - name: bal_account_type
      no: 3
      type: Option
      db_name: bal_account_type
      options: ["G/L Account", "Bank Account"]

    - name: bal_account_no
      no: 4
      type: types.Code
      db_name: bal_account_no
      length: 20
      # G/L Account; Bank Account comes with its table
      table_relation:
        conditions:
          - when: {field: bal_account_type, equal: 0}
            table: G_L_Account
            field: no
            filters:
              account_type: {const: 0}   # Posting accounts only
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: bal_account_type, equal: 1}
            table: Bank_Account
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250

  keys:
    - name: Primary
      fields: [code]
      clustered: true
