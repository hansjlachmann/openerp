table:
  id: 111
  name: "Sales_Shipment_Line"
  description: "Sales Shipment Line (table 111): a line of a posted sales shipment"
  fields:
    - name: sell_to_customer_no
      no: 2
      type: types.Code
      db_name: sell_to_customer_no
      length: 20
      editable: false
      table_relation:
        table: Customer
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250
          - source: city
            width: 250

    - name: document_no
      no: 3
      type: types.Code
      db_name: document_no
      length: 20
      primary_key: true

    - name: line_no
      no: 4
      type: int
      db_name: line_no
      primary_key: true

    - name: type
      no: 5
      type: Option
      db_name: type
      options: [" ", "G/L Account", "Item", "Resource"]

    - name: no
      no: 6
      type: types.Code
      db_name: no
      length: 20
      table_relation:
        conditions:
          - when: {field: type, equal: 0}
            table: Standard_Text
            field: code
            lookup_columns:
              - source: code
                width: 100
              - source: description
                width: 250
          - when: {field: type, equal: 1}
            table: G_L_Account
            field: no
            filters:
              account_type: {const: 0}   # Posting accounts only
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250
          - when: {field: type, equal: 2}
            table: Item
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: description
                width: 250
          - when: {field: type, equal: 3}
            table: Resource
            field: no
            lookup_columns:
              - source: no
                width: 100
              - source: name
                width: 250

    - name: location_code
      no: 7
      type: types.Code
      db_name: location_code
      length: 10
      table_relation:
        table: Location
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: posting_group
      no: 8
      type: types.Code
      db_name: posting_group
      length: 10
      editable: false
      table_relation:
        conditions:
          - when: {field: type, equal: 2}
            table: Inventory_Posting_Group
            field: code
            lookup_columns:
              - source: code
                width: 100
              - source: description
                width: 250

    - name: quantity_disc_code
      no: 9
      type: types.Code
      db_name: quantity_disc_code
      length: 20
      editable: false

    - name: shipment_date
      no: 10
      type: types.Date
      db_name: shipment_date

    - name: description
      no: 11
      type: types.Text
      db_name: description
      length: 50

    - name: description_2
      no: 12
      type: types.Text
      db_name: description_2
      length: 50

    - name: unit_of_measure
      no: 13
      type: types.Text
      db_name: unit_of_measure
      length: 10
      editable: false

    - name: quantity
      no: 15
      type: types.Decimal
      db_name: quantity
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: unit_price
      no: 22
      type: types.Decimal
      db_name: unit_price
      decimal_places: "2:5"
      precision: 18
      scale: 5

    - name: unit_cost_lcy
      no: 23
      type: types.Decimal
      db_name: unit_cost_lcy
      decimal_places: "2:5"
      precision: 18
      scale: 5

    - name: tax_percent
      no: 25
      type: types.Decimal
      db_name: tax_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: quantity_disc_percent
      no: 26
      type: types.Decimal
      db_name: quantity_disc_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: line_discount_percent
      no: 27
      type: types.Decimal
      db_name: line_discount_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5
      validation: {min: 0, max: 100}

    - name: line_discount_amount
      no: 28
      type: types.Decimal
      db_name: line_discount_amount
      decimal_places: "2:2"
      precision: 18
      scale: 5

    - name: amount
      no: 29
      type: types.Decimal
      db_name: amount
      decimal_places: "2:2"
      precision: 18
      scale: 5
      editable: false

    - name: amount_including_tax
      no: 30
      type: types.Decimal
      db_name: amount_including_tax
      decimal_places: "2:2"
      precision: 18
      scale: 5
      editable: false

    - name: allow_invoice_disc
      no: 32
      type: bool
      db_name: allow_invoice_disc
      default: true

    - name: gross_weight
      no: 34
      type: types.Decimal
      db_name: gross_weight
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: net_weight
      no: 35
      type: types.Decimal
      db_name: net_weight
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: units_per_parcel
      no: 36
      type: types.Decimal
      db_name: units_per_parcel
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: unit_volume
      no: 37
      type: types.Decimal
      db_name: unit_volume
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: department_code
      no: 40
      type: types.Code
      db_name: department_code
      length: 10
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_code
      no: 41
      type: types.Code
      db_name: project_code
      length: 10
      table_relation:
        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: price_group_code
      no: 42
      type: types.Code
      db_name: price_group_code
      length: 10
      editable: false
      table_relation:
        table: Price_Group
        field: code
        lookup_columns:
          - source: code
            width: 100

    - name: allow_quantity_disc
      no: 43
      type: bool
      db_name: allow_quantity_disc
      default: true

    - name: work_type_code
      no: 52
      type: types.Code
      db_name: work_type_code
      length: 10
      table_relation:
        table: Work_Type
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: cust_item_disc_percent
      no: 55
      type: types.Decimal
      db_name: cust_item_disc_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: qty_shipped_not_invoiced
      no: 58
      type: types.Decimal
      db_name: qty_shipped_not_invoiced
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: quantity_invoiced
      no: 61
      type: types.Decimal
      db_name: quantity_invoiced
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: order_no
      no: 65
      type: types.Code
      db_name: order_no
      length: 20

    - name: order_line_no
      no: 66
      type: int
      db_name: order_line_no

    - name: profit_percent
      no: 67
      type: types.Decimal
      db_name: profit_percent
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: bill_to_customer_no
      no: 68
      type: types.Code
      db_name: bill_to_customer_no
      length: 20
      editable: false
      table_relation:
        table: Customer
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250
          - source: city
            width: 250

    - name: inv_discount_amount
      no: 69
      type: types.Decimal
      db_name: inv_discount_amount
      decimal_places: "2:2"
      precision: 18
      scale: 5
      editable: false

    - name: gen_bus_posting_group
      no: 74
      type: types.Code
      db_name: gen_bus_posting_group
      length: 10
      table_relation:
        table: Gen_Business_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: gen_prod_posting_group
      no: 75
      type: types.Code
      db_name: gen_prod_posting_group
      length: 10
      table_relation:
        table: Gen_Product_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_calculation_type
      no: 77
      type: Option
      db_name: tax_calculation_type
      options: ["Normal VAT", "Reverse Charge VAT", "Full VAT", "Sales Tax"]
      editable: false

    - name: tax_area_code
      no: 85
      type: types.Code
      db_name: tax_area_code
      length: 20
      table_relation:
        table: Tax_Area
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_liable
      no: 86
      type: bool
      db_name: tax_liable

    - name: tax_group_code
      no: 87
      type: types.Code
      db_name: tax_group_code
      length: 10
      table_relation:
        table: Tax_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_bus_posting_group
      no: 89
      type: types.Code
      db_name: tax_bus_posting_group
      length: 10
      table_relation:
        table: Tax_Business_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_prod_posting_group
      no: 90
      type: types.Code
      db_name: tax_prod_posting_group
      length: 10
      table_relation:
        table: Tax_Product_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: currency_code
      no: 91
      type: types.Code
      db_name: currency_code
      length: 10
      editable: false
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: tax_base_amount
      no: 99
      type: types.Decimal
      db_name: tax_base_amount
      decimal_places: "2:2"
      precision: 18
      scale: 5
      editable: false

    - name: unit_cost
      no: 100
      type: types.Decimal
      db_name: unit_cost
      decimal_places: "2:5"
      precision: 18
      scale: 5
      editable: false

    - name: item_shpt_entry_no
      no: 900
      type: int
      db_name: item_shpt_entry_no

    - name: variant_code
      no: 5402
      type: types.Code
      db_name: variant_code
      length: 10
      table_relation:
        conditions:
          - when: {field: type, equal: 2}
            table: Item_Variant
            field: code
            filters:
              item_no: {field: "no"}
            lookup_columns:
              - source: code
                width: 100
              - source: description
                width: 250

    - name: qty_per_unit_of_measure
      no: 5404
      type: types.Decimal
      db_name: qty_per_unit_of_measure
      decimal_places: "0:5"
      precision: 18
      scale: 5
      default: 1
      editable: false

    - name: unit_of_measure_code
      no: 5407
      type: types.Code
      db_name: unit_of_measure_code
      length: 10
      table_relation:
        conditions:
          - when: {field: type, equal: 2}
            table: Item_Unit_of_Measure
            field: code
            filters:
              item_no: {field: "no"}
            lookup_columns:
              - source: code
                width: 100
              - source: qty_per_unit_of_measure
                width: 120
          - when: {field: type, equal: 3}
            table: Unit_of_Measure
            field: code
            lookup_columns:
              - source: code
                width: 100
              - source: description
                width: 250

    - name: quantity_base
      no: 5415
      type: types.Decimal
      db_name: quantity_base
      decimal_places: "0:5"
      precision: 18
      scale: 5

    - name: qty_shpd_not_invd_base
      no: 5458
      type: types.Decimal
      db_name: qty_shpd_not_invd_base
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

    - name: qty_invoiced_base
      no: 5461
      type: types.Decimal
      db_name: qty_invoiced_base
      decimal_places: "0:5"
      precision: 18
      scale: 5
      editable: false

  keys:
    - name: Primary
      fields: [document_no, line_no]
      clustered: true
    - name: type_no
      fields: [type, "no"]
