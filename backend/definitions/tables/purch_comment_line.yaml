table:
  id: 43
  name: "Purch_Comment_Line"
  description: "Purch. Comment Line (table 43): comments on purchase documents"
  fields:
    - name: document_type
      no: 1
      type: Option
      db_name: document_type
      options: ["Quote", "Order", "Invoice", "Credit Memo", "Blanket Order", "Receipt", "Posted Invoice", "Posted Credit Memo"]
      primary_key: true

    - name: no
      no: 2
      type: types.Code
      db_name: no
      length: 20
      primary_key: true

    - name: line_no
      no: 3
      type: int
      db_name: line_no
      primary_key: true

    - name: date
      no: 4
      type: types.Date
      db_name: date

    - name: code
      no: 5
      type: types.Code
      db_name: code
      length: 10

    - name: comment
      no: 6
      type: types.Text
      db_name: comment
      length: 80

  keys:
    - name: Primary
      fields: [document_type, "no", line_no]
      clustered: true
