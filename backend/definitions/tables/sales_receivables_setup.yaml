table:
  id: 311
  name: "Sales_Receivables_Setup"
  caption: Sales & Receivables Setup
  description: "Sales and receivables setup (table 311), a single record per company"
  setup_table: true    # singleton: a single record with a blank Primary Key
  fields:
    - name: primary_key
      no: 1
      type: types.Code
      db_name: primary_key
      length: 10
      primary_key: true

    - name: discount_posting
      no: 2
      type: Option
      db_name: discount_posting
      options: ["No Discounts", "Invoice Discounts", "Line Discounts", "All Discounts"]

    - name: line_discount_calculation
      no: 3
      type: Option
      db_name: line_discount_calculation
      options: ["Qty. Disc. + Cust./Item Disc.", "Qty. Disc. * Cust./Item Disc."]

    - name: credit_warnings
      no: 4
      type: Option
      db_name: credit_warnings
      options: ["Both Warnings", "Credit Limit", "Overdue Balance", "No Warning"]

    - name: stockout_warning
      no: 5
      type: bool
      db_name: stockout_warning
      default: true

    - name: shipment_on_invoice
      no: 6
      type: bool
      db_name: shipment_on_invoice

    - name: invoice_rounding
      no: 7
      type: bool
      db_name: invoice_rounding

    - name: ext_doc_no_mandatory
      no: 8
      type: bool
      db_name: ext_doc_no_mandatory

    - name: customer_nos
      no: 9
      type: types.Code
      db_name: customer_nos
      length: 10
      table_relation:
        table: No_Series
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

