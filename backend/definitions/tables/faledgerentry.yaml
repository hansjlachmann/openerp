  keys:
    - name: Primary
      fields: [entry_no]
      clustered: true
    - name: fa_book_date
      fields: [fa_no, depreciation_book_code, fa_posting_date]
      sum_index_fields:
        - amount
    - name: fa_book_type
      fields: [fa_no, depreciation_book_code, fa_posting_category, fa_posting_type, fa_posting_date, part_of_book_value, reclassification_entry]
      sum_index_fields:
        - amount
    - name: fa_book_value
      fields: [fa_no, depreciation_book_code, part_of_book_value, fa_posting_date]
      sum_index_fields:
        - amount
    - name: fa_book_basis
      fields: [fa_no, depreciation_book_code, part_of_depreciable_basis, fa_posting_date]
      sum_index_fields:
        - amount
    - name: fa_book_type_posting_date
      fields: [fa_no, depreciation_book_code, fa_posting_category, fa_posting_type, posting_date]
      sum_index_fields:
        - amount
    - name: canceled_from
      fields: [canceled_from_fa_no, depreciation_book_code, fa_posting_date]
    - name: document
      fields: [document_no, posting_date]
    - name: g_l_entry
      fields: [g_l_entry_no]
