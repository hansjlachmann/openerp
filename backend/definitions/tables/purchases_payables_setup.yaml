      no: 20
      type: bool
      db_name: calc_inv_discount

    - name: appln_between_currencies
      no: 21
      type: Option
      db_name: appln_between_currencies
      options: ["None", "EMU", "All"]

    - name: copy_comments_blanket_to_order
      no: 22
      type: bool
