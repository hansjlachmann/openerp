table:
  id: 18
  name: "Customer"
  description: "Customers (table 18)"
  data_caption_fields: [no, name]
  auto_key: true   # OnInsert gives a customer without No. the next number of its series
  # Left out until their tables exist: 78/79/113/114 Outstanding
  # Orders / Shipped Not Invoiced (Sales Line); 10004/10015 (local field series)
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      length: 50

    - name: search_name
      no: 3
      type: types.Code
      db_name: search_name
      length: 50

    - name: name_2
      no: 4
      type: types.Text
      db_name: name_2
      length: 50

    - name: address
      no: 5
