table:
  id: 3
  name: "Payment Terms"
  api_name: Payment_terms # the name in the API and in pages (source_table)
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      primary_key: true
      length: 10
      required: true

    - name: due_date_calculation
      no: 2
      type: types.Code
      db_name: due_date_calculation
      caption: Due Date Calculation
      length: 20
      date_formula: true # e.g. 30D, 14D, CM, 1M+CM

    - name: discount_date_calculation
      no: 3
      type: types.Code
      db_name: discount_date_calculation
      caption: Discount Date Calculation
      length: 20
      date_formula: true

    - name: discount_percent
      no: 4
      type: types.Decimal
      db_name: discount_percent
      precision: 18
      scale: 5
      decimal_places: "0:5"
      validation: {min: 0, max: 100}

    - name: description
      no: 5
      type: types.Text
      db_name: description
      length: 50 # widened from 30 by migration 13

    - name: active
      no: 900
      type: bool
      db_name: active
      caption: Active
      default: true
