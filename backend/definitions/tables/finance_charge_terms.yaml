table:
  id: 5
  name: "Finance_Charge_Terms"
  caption: Finance Charge Terms
  description: Finance charge terms (table 5)
  data_caption_fields: [code, description]
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      primary_key: true
      length: 10
      required: true

    - name: interest_rate
      no: 2
      type: types.Decimal
      db_name: interest_rate
      precision: 18
      scale: 5
      decimal_places: "0:5"
      validation: {min: 0, max: 100}

    - name: minimum_amount_lcy
      no: 3
      type: types.Decimal
      db_name: minimum_amount_lcy
      precision: 18
      scale: 5
      decimal_places: "2:2"
      validation: {min: 0}

    - name: additional_fee_lcy
      no: 5
      type: types.Decimal
      db_name: additional_fee_lcy
      precision: 18
      scale: 5
      decimal_places: "2:2"
      validation: {min: 0}

    - name: description
      no: 7
      type: types.Text
      db_name: description
      length: 30

    - name: interest_calculation_method
      no: 8
      type: Option
      db_name: interest_calculation_method
      options: ["Average Daily Balance", "Balance Due"]

    - name: interest_period_days
      no: 9
      type: int
      db_name: interest_period_days

    - name: grace_period
      no: 10
      type: types.Code
      db_name: grace_period
      length: 20
      date_formula: true

    - name: due_date_calculation
      no: 11
      type: types.Code
      db_name: due_date_calculation
      length: 20
      date_formula: true

    - name: interest_calculation
      no: 12
      type: Option
      db_name: interest_calculation
      options: ["Open Entries", "Closed Entries", "All Entries"]

    - name: post_interest
      no: 13
      type: bool
      db_name: post_interest
      default: true

    - name: post_additional_fee
      no: 14
      type: bool
      db_name: post_additional_fee
      default: true

    - name: line_description
      no: 15
      type: types.Text
      db_name: line_description
      length: 50

  keys:
    - name: Primary
      fields: [code]
      clustered: true
