table:
  id: 9
  name: "Menu"
  caption: Menu
  description: Menu profiles for users
  global: true  # Global table - no company prefix
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      caption: Code
      primary_key: true
      length: 20
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      caption: Description
      length: 50

    - name: filename
      no: 3
      type: types.Text
      db_name: filename
      caption: Filename
      description: YAML filename in menus folder (without .yaml extension)
      length: 50

  keys:
    - name: Primary
      fields: [code]
      clustered: true
