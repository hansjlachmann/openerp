      db_name: bank_account_no
      length: 30

    - name: transit_no
      no: 14
      type: types.Text
      db_name: transit_no
      length: 20

    - name: territory_code
      no: 15
      type: types.Code
      db_name: territory_code
      length: 10
      table_relation:
        table: Territory
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: department_code
      no: 16
      type: types.Code
      db_name: department_code
      length: 10
      table_relation:
        table: Department
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: project_code
      no: 17
