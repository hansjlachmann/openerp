        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: comment
      no: 38
      type: bool
      flow_field: true
      calc_formula: Exist
      source_table: CommentLine
      source_field: line_no
      flow_filters:
        - field: table_name
          type: const
          value: 8
        - field: no
          type: field
          value: no

    - name: blocked
      no: 39
      type: bool
      db_name: blocked

    - name: last_statement_no
      no: 41
