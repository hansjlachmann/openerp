      calc_formula: Sum
      source_table: BankAccountLedgerEntry
      source_field: amount
      flow_filters:
        - field: bank_account_no
          type: field
          value: no
        - field: department_code
          type: filter
          value: department_filter
        - field: project_code
          type: filter
          value: project_filter

    - name: balance_lcy
      no: 59
