table:
  id: 270
  name: "Bank_Account"
  caption: Bank Account
  description: "Bank accounts (table 270)"
  data_caption_fields: [no, name]
  auto_key: true   # OnInsert gives a bank account without No. the next number of its series
  lookup_page_id: 371
  # Left out: 94 Balance Last Statement asks before a change (no dialog in table triggers yet);
  # 108/109 Check Report ID/Name (Object table); 10005–10011 (local field series)
  fields:
    - name: no
      no: 1
      type: types.Code
      db_name: no
      length: 20
      primary_key: true
      required: true

    - name: name
      no: 2
      type: types.Text
      db_name: name
      length: 50

    - name: search_name
      no: 3
      type: types.Code
      db_name: search_name
      length: 50

    - name: name_2
      no: 4
      type: types.Text
      db_name: name_2
      length: 50

    - name: address
      no: 5
      type: types.Text
      db_name: address
      length: 50

    - name: address_2
      no: 6
      type: types.Text
      db_name: address_2
      length: 50

    - name: city
      no: 7
      type: types.Text
      db_name: city
      length: 50

    - name: contact
      no: 8
      type: types.Text
      db_name: contact
      length: 50

    - name: phone_no
      no: 9
      type: types.Text
      db_name: phone_no
