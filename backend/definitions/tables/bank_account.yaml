        table: Project
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: chain_name
      no: 18
      type: types.Code
      db_name: chain_name
      length: 10

    - name: min_balance
      no: 20
      type: types.Decimal
      db_name: min_balance
      precision: 18
      scale: 2
      decimal_places: "2:2"

    - name: bank_acc_posting_group
      no: 21
      type: types.Code
      db_name: bank_acc_posting_group
      length: 10
      table_relation:
        table: Bank_Account_Posting_Group
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: g_l_bank_account_no
            width: 250

    - name: currency_code
      no: 22
      type: types.Code
      db_name: currency_code
      length: 10
      table_relation:
        table: Currency
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: language_code
      no: 24
      type: types.Code
      db_name: language_code
      length: 10
      table_relation:
        table: Language
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: name
            width: 250

    - name: statistics_group
      no: 26
      type: int
