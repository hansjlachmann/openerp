table:
  id: 320
  name: "Tax_Jurisdiction"
  caption: Tax Jurisdiction
  description: "Tax jurisdictions (table 320): the authorities that levy sales tax, with their tax accounts"
  lookup_page_id: 466
  data_caption_fields: [code, description]
  fields:
    - name: code
      no: 1
      type: types.Code
      db_name: code
      length: 10
      primary_key: true
      required: true

    - name: description
      no: 2
      type: types.Text
      db_name: description
      length: 30

    - name: tax_account_sales
      no: 3
      type: types.Code
      db_name: tax_account_sales
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: tax_account_purchases
      no: 4
      type: types.Code
      db_name: tax_account_purchases
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: report_to_jurisdiction
      no: 5
      type: types.Code
      db_name: report_to_jurisdiction
      length: 10
      table_relation:
        table: Tax_Jurisdiction
        field: code
        lookup_columns:
          - source: code
            width: 100
          - source: description
            width: 250

    - name: date_filter
      no: 6
      type: types.Date
      db_name: date_filter
      flow_filter: true

    - name: tax_group_filter
      no: 7
      type: types.Code
      db_name: tax_group_filter
      length: 10
      flow_filter: true

    - name: unreal_tax_acc_sales
      no: 8
      type: types.Code
      db_name: unreal_tax_acc_sales
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: unreal_tax_acc_purchases
      no: 9
      type: types.Code
      db_name: unreal_tax_acc_purchases
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: reverse_charge_purchases
      no: 10
      type: types.Code
      db_name: reverse_charge_purchases
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: unreal_rev_charge_purch
      no: 11
      type: types.Code
      db_name: unreal_rev_charge_purch
      length: 20
      table_relation:
        table: G_L_Account
        field: no
        lookup_columns:
          - source: no
            width: 100
          - source: name
            width: 250

    - name: unrealized_tax_type
      no: 12
      type: Option
      db_name: unrealized_tax_type
      options: [" ", "Percentage", "First", "Last", "First (Fully Paid)", "Last (Fully Paid)"]

    - name: calculate_tax_on_tax
      no: 13
      type: bool
      db_name: calculate_tax_on_tax

    - name: adjust_for_payment_discount
      no: 14
      type: bool
      db_name: adjust_for_payment_discount

  keys:
    - name: Primary
      fields: [code]
      clustered: true
    - name: report_to
      fields: [report_to_jurisdiction]
