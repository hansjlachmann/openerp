# Demo data: building blocks for the generated customers of the LARGE set.
# A name is first + second + legal form, e.g. "Fjord" + "kraft" + " AS".
# Addresses are street + house number (or number + street with house_number_first).
# In phone patterns each # becomes a digit.

countries:
  - country: "NO"
    first: [Fjord, Nord, Vest, Berg, Lys, Skog, Havn, Polar, Elve, Fjell, Sol, Dal, Vik, Nes, Brygge]
    second: [kraft, data, bygg, mat, tre, møbler, service, handel, transport, design, regnskap, elektro, sjømat, trykk, maskin]
    legal_forms: [" AS", " AS", " AS", " ASA", " ANS"]
    streets: [Storgata, Kirkegata, Kongens gate, Dronningens gate, Strandveien, Industriveien, Havnegata, Torggata, Parkveien, Skolegata]
    cities:
      - { city: Oslo, post_codes: ["0150", "0159", "0250", "0458", "0560", "0661"] }
      - { city: Bergen, post_codes: ["5003", "5006", "5015", "5089"] }
      - { city: Trondheim, post_codes: ["7010", "7011", "7030", "7042"] }
      - { city: Stavanger, post_codes: ["4006", "4010", "4021"] }
      - { city: Drammen, post_codes: ["3015", "3044"] }
      - { city: Tromsø, post_codes: ["9008", "9010"] }
      - { city: Kristiansand, post_codes: ["4611", "4614"] }
      - { city: Ålesund, post_codes: ["6002", "6008"] }
    phone: "+47 ## ## ## ##"

  - country: DK
    first: [Nørre, Strand, Øster, Kyst, Bølge, Lund, Hav, Sol, Vester, Mølle, Fjord, Skov, Bro, Eng, Klint]
    second: [møbler, data, byg, mad, handel, design, transport, el, tryk, service, revision, kaffe, vin, cykler, glas]
    legal_forms: [" ApS", " ApS", " A/S", " I/S"]
    streets: [Nørregade, Vestergade, Algade, Strandvejen, Søndergade, Havnegade, Industrivej, Torvet, Kongensgade, Skolevej]
    cities:
      - { city: København K, post_codes: ["1050", "1260", "1360", "1455"] }
      - { city: København N, post_codes: ["2200"] }
      - { city: Aarhus C, post_codes: ["8000"] }
      - { city: Odense C, post_codes: ["5000"] }
      - { city: Aalborg, post_codes: ["9000"] }
      - { city: Esbjerg, post_codes: ["6700"] }
      - { city: Vejle, post_codes: ["7100"] }
      - { city: Roskilde, post_codes: ["4000"] }
