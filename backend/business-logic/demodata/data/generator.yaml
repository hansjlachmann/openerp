  - country: GB
    first: [Thames, Pennine, Albion, Mersey, Cotswold, Kingsway, Highgate, Severn, Windsor, Bramble, Tyne, Chiltern, Avon, Mendip, Solent]
    second: [" Office Supplies", " Logistics", " Engineering", " Trading", " Furniture", " Consulting", " Foods", " Print", " Electrical", " Systems", " Textiles", " Builders", " Marine", " Analytics", " Packaging"]
    legal_forms: [" Ltd", " Ltd", " Ltd", " PLC", " LLP"]
    streets: [High Street, Station Road, Church Lane, Victoria Road, Mill Lane, King Street, Queen Street, Market Place, Park Road, London Road]
    cities:
      - { city: London, post_codes: [EC1A 1BB, EC4V 3BJ, WC2B 6AA, SE1 7PB, N1 9GU] }
      - { city: Manchester, post_codes: [M1 2AB, M3 2BW, M4 5JD] }
      - { city: Leeds, post_codes: [LS1 6HD, LS2 7EY] }
