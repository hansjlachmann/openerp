    records:
      - {code: EUR, description: Euro, amount_rounding_precision: 0.01, invoice_rounding_precision: 0.01, realized_gains_acc: "6140", realized_losses_acc: "6150", unrealized_gains_acc: "6160", unrealized_losses_acc: "6170"}
