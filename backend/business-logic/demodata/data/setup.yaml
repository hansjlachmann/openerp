      - {no: "5000", name: "Operating Expenses", account_type: 3, income_balance: 0, direct_posting: false}
      - {no: "5110", name: "Salaries", account_type: 0, income_balance: 0}
      - {no: "5120", name: "Rent", account_type: 0, income_balance: 0}
      - {no: "5130", name: "Office Supplies", account_type: 0, income_balance: 0}
      - {no: "5140", name: "Realized Exchange Gains", account_type: 0, income_balance: 0}
