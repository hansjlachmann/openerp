# Demo data: setup tables. Records that already exist are left as they are.

countries:
  - code: "NO"
    name: Norway
  - code: DK
    name: Denmark
    eu_country_code: DK
  - code: GB
    name: United Kingdom

payment_terms:
  # due_days is demo-only: it sets the due date of the generated invoices
  - code: 14 DAYS
    description: Net 14 days
    due_days: 14
  - code: 30 DAYS
    description: Net 30 days
    due_days: 30
  - code: CM
    description: Current month
    due_days: 30
  - code: COD
    description: Cash on delivery
    due_days: 0

# Master data (migrated master data and setup tables): records by table, inserted with the tables' defaults for the
# fields not given
master_data:
  - table: General_Ledger_Setup   # the single setup record (blank key)
    records:
      - {lcy_code: NOK, amount_rounding_precision: 0.01, unit_amount_rounding_precision: 0.00001, inv_rounding_precision_lcy: 1, appln_rounding_precision: 0.01, local_address_format: 0}
  - table: Tax_Business_Posting_Group
    records:
      - {code: DOMESTIC, description: Domestic customers and vendors}
      - {code: EXPORT, description: Customers and vendors abroad}
  - table: Tax_Product_Posting_Group
    records:
      - {code: STANDARD, description: Standard rate}
      - {code: REDUCED, description: Reduced rate}
      - {code: EXEMPT, description: Exempt}
  - table: Tax_Area
    records:
      - {code: DOMESTIC, description: Domestic}
      - {code: ABROAD, description: Abroad}
  - table: Tax_Group
    records:
      - {code: TAXABLE, description: Taxable}
      - {code: NONTAXABLE, description: Not taxable}
  - table: Gen_Business_Posting_Group
    records:
      - {code: DOMESTIC, description: Domestic customers and vendors, def_tax_bus_posting_group: DOMESTIC}
      - {code: EXPORT, description: Customers and vendors abroad, def_tax_bus_posting_group: EXPORT}
  - table: Gen_Product_Posting_Group
    records:
      - {code: RETAIL, description: Retail goods, def_tax_prod_posting_group: STANDARD}
      - {code: SERVICES, description: Services, def_tax_prod_posting_group: STANDARD}
      - {code: FOOD, description: Food, def_tax_prod_posting_group: REDUCED}
  - table: G_L_Account   # a small chart of accounts, indented at the end (Indent Chart of Accounts)
    records:
      - {no: "1000", name: "BALANCE SHEET", account_type: 1, income_balance: 1, direct_posting: false}
      - {no: "1100", name: "Assets", account_type: 3, income_balance: 1, direct_posting: false}
      - {no: "1110", name: "Fixed Assets", account_type: 3, income_balance: 1, direct_posting: false}
      - {no: "1120", name: "Machinery and Equipment", account_type: 0, income_balance: 1}
      - {no: "1130", name: "Vehicles", account_type: 0, income_balance: 1}
      - {no: "1190", name: "Total Fixed Assets", account_type: 4, income_balance: 1, direct_posting: false}
      - {no: "1200", name: "Current Assets", account_type: 3, income_balance: 1, direct_posting: false}
      - {no: "1210", name: "Inventory", account_type: 0, income_balance: 1}
      - {no: "1220", name: "Accounts Receivable", account_type: 0, income_balance: 1}
      - {no: "1230", name: "Bank", account_type: 0, income_balance: 1, reconciliation_account: true}
      - {no: "1240", name: "Cash", account_type: 0, income_balance: 1}
      - {no: "1290", name: "Total Current Assets", account_type: 4, income_balance: 1, direct_posting: false}
      - {no: "1999", name: "Total Assets", account_type: 4, income_balance: 1, direct_posting: false}
      - {no: "2000", name: "Liabilities and Equity", account_type: 3, income_balance: 1, direct_posting: false}
      - {no: "2100", name: "Equity", account_type: 0, income_balance: 1}
      - {no: "2200", name: "Long-term Liabilities", account_type: 0, income_balance: 1}
      - {no: "2300", name: "Accounts Payable", account_type: 0, income_balance: 1}
      - {no: "2400", name: "Sales Tax Payable", account_type: 0, income_balance: 1}
      - {no: "2999", name: "Total Liabilities and Equity", account_type: 4, income_balance: 1, direct_posting: false}
      - {no: "3000", name: "INCOME STATEMENT", account_type: 1, income_balance: 0, direct_posting: false}
      - {no: "3100", name: "Revenue", account_type: 3, income_balance: 0, direct_posting: false}
