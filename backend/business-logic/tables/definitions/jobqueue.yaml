table:
  id: 472
  name: "Job_Queue"
  fields:
    - name: no
      type: types.Code
      db_name: no
      primary_key: true
      length: 20
      required: true

    - name: description
      type: types.Text
      db_name: description
      length: 100

    - name: description_2
      type: types.Text
      db_name: description_2
      length: 100

    - name: status
      type: Option
      db_name: status
      options: ["On Hold", "Ready", "Error"]

    - name: object_id_to_run
      type: int
      db_name: object_id_to_run

    - name: parameter
      type: types.Text
      db_name: parameter
      length: 2000

    - name: next_start
      type: types.DateTime
      db_name: next_start

    - name: minutes_between_run
      type: int
      db_name: minutes_between_run

    - name: recurring_job
      type: bool
      db_name: recurring_job

    - name: recurrence
      type: Option
      db_name: recurrence
      options: ["Once", "Minutes", "Hourly", "Daily", "Weekly", "Monthly"]

    - name: notification_email
      type: types.Text
      db_name: notification_email
      length: 100

    - name: notify_on
      type: Option
      db_name: notify_on
      options: ["Never", "Always", "On Error"]

    # FlowField - count of related Job Queue Entries
    - name: number_of_entries
      type: int
      flow_field: true
      calc_formula: Count
      source_table: Job_Queue_Entry
      source_field: entry_no
      flow_filters:
        - field: job_queue_no
          type: field
          value: no
