page:
  id: 33
  type: List
  name: User Members
  source_table: User_Member
  caption: User Members
  editable: true
  # Insert only when leaving the row (BC DelayedInsert): the key is user + role + company,
  # and a blank company means "all companies" — never save a half-entered membership
  delayed_insert: true

  layout:
    repeater:
      fields:
        - source: user_id
          width: 200
          table_relation: User

        - source: role_id
          width: 150
          table_relation: User_Role

        - source: company
          width: 200
          table_relation: Company

  actions:
    - name: New
      caption: New
      shortcut: Alt+N
      promoted: true
      enabled: true

    - name: Edit
      caption: Edit
      shortcut: Ctrl+E
      promoted: true
      enabled: true

    - name: Delete
      caption: Delete
      shortcut: Ctrl+D
      promoted: true
      enabled: true

    - name: Refresh
      caption: Refresh
      shortcut: F5
      promoted: true
      enabled: true
